<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arcade Vending Machine</title>

<style>
body {
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: monospace;
}

/* MACHINE */
.machine {
  position: relative;
  width: 540px;
  background: linear-gradient(145deg, #ff00cc, #3333ff);
  border-radius: 30px;
  padding: 20px;
  box-shadow: 0 0 40px #ff00cc;
}

/* DISPLAY */
.display {
  background: black;
  color: #00ff99;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid #00ffcc;
}

/* GRID */
.grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-top: 15px;
  min-height: 300px;
}

.item {
  background: white;
  border-radius: 15px;
  padding: 10px;
  text-align: center;
}

.item img {
  width: 100%;
  height: 80px;
  object-fit: contain;
}

.item.active {
  box-shadow: 0 0 20px red, 0 0 40px yellow;
}

/* DROP */
.fall {
  position: absolute;
  width: 70px;
  left: 50%;
  transform: translateX(-50%);
  animation: drop 1s ease forwards;
  z-index: 10;
}

@keyframes drop {
  0% { top: 0; }
  100% { top: 320px; }
}

/* KEYPAD */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.keypad button {
  border-radius: 50%;
  background: red;
  color: white;
  padding: 12px;
  border: none;
}

/* 🟥 TRAY (REAL POSITION) */
.tray-slot {
  margin-top: 20px;
  height: 60px;
  background: #111;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 20px black;
}

.tray-item {
  position: absolute;
  top: -80px;
  left: 50%;
  transform: translateX(-50%);
  width: 70px;
  animation: dropToTray 0.8s ease forwards;
}

@keyframes dropToTray {
  to {
    top: 5px;
  }
}
/* 🔥 SIDE PANEL (MATCHES REFERENCE) */
.side-panel {
  position: absolute;
  right: -130px;
  top: 0;
  width: 110px;
  height: 100%;
  background: linear-gradient(#d9d9d9, #bfbfbf);
  border-radius: 25px;
  padding: 12px;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;

  box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
}

/* 🟢 LED DISPLAY */
.panel-led {
  background: #111;
  color: #00ff00;
  font-size: 22px;
  padding: 10px;
  border-radius: 12px;
  width: 70px;
  text-align: center;

  font-family: monospace;
  letter-spacing: 2px;

  box-shadow: inset 0 0 10px #00ff00;
}

/* 🔴 LIGHTS */
.lights {
  display: flex;
  gap: 10px;
}

.light {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(0,0,0,0.6);
}

.green {
  background: lime;
  box-shadow: 0 0 10px lime;
}

.red {
  background: red;
  box-shadow: 0 0 10px red;
}

/* 🪙 COIN SLOT */
.coin-slot {
  width: 20px;
  height: 45px;
  background: black;
  border-radius: 4px;
  box-shadow: inset 0 0 8px #000;
}

/* 🪙 COIN */
.coin {
  width: 26px;
  height: 26px;
  background: radial-gradient(circle, gold, orange);
  border-radius: 50%;
  cursor: pointer;

  box-shadow: 0 0 10px gold;
  transition: 0.5s;
}

/* 💥 INSERT ANIMATION */
.coin.insert {
  transform: translateY(-50px) scale(0.5);
  opacity: 0;
}

/* 🔢 KEYPAD GRID (VISUAL) */
.mini-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 5px;
}

.mini-grid div {
  width: 22px;
  height: 22px;
  background: linear-gradient(#bbb,#888);
  border-radius: 4px;
  box-shadow: inset 0 0 5px #555;
}

/* 🎮 JOYSTICK */
.joystick {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: radial-gradient(circle, #eee, #777);
  box-shadow: inset 0 0 10px #555, 0 0 10px rgba(0,0,0,0.5);
}

/* 🔻 ARROW */
.arrow {
  width: 0;
  height: 0;
  border-left: 18px solid transparent;
  border-right: 18px solid transparent;
  border-top: 30px solid red;

  filter: drop-shadow(0 0 5px red);
}

/* 📦 PANEL TRAY */
.panel-tray {
  width: 65px;
  height: 45px;
  background: #333;
  border-radius: 10px;
  box-shadow: inset 0 0 10px black;
}
</style>
</head>

<body tabindex="0">

<div class="machine">

<div class="display" id="display">PRESS START</div>

1</button>
  <button onclick="pressKey('2')"><section class="grid" id="grid">

<!-- A -->
<div class="item" data-code="A1" data-name="Doritos"><img src="doritos.jpeg"><p>Doritos</p></div>
<div class="item" data-code="A2" data-name="Pringles"><img src="pringles.jpeg"><p>Pringles</p></div>
<div class="item" data-code="A3" data-name="Lays"><img src="lays.jpeg"><p>Lays</p></div>

<!-- B -->
<div class="item" data-code="B1" data-name="Coke"><img src="coke.jpeg"><p>Coke</p></div>
<div class="item" data-code="B2" data-name="Sprite"><img src="sprite.jpeg"><p>Sprite</p></div>
<div class="item" data-code="B3" data-name="Red Bull"><img src="red bull.jpeg"><p>Red Bull</p></div>

<!-- C -->
<div class="item" data-code="C1" data-name="Mystery"><img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png"><p>🎁</p></div>
<div class="item" data-code="C2" data-name="XP Candy"><img src="xpcandy.jpeg"><p></p>🍬</div>
<div class="item" data-code="C3" data-name="Jackpot"><img src="https://cdn-icons-png.flaticon.com/512/3468/3468377.png"><p>🏆</p></div>

</section>

<div class="keypad">
  <button onclick="pressKey('A')">A</button>
  <button onclick="pressKey('B')">B</button>
  <button onclick="pressKey('C')">C</button>
  <button onclick="pressKey('1')">2</button>
  <button onclick="pressKey('3')">3</button>
</div>

<!-- 🟥 REAL TRAY -->
<div class="tray-slot" id="traySlot"></div>

<!-- SIDE PANEL -->
<div class="side-panel">
  <div class="panel-led" id="panelLED">A1</div>
  <button class="coin-btn" onclick="insertCoin()">🪙</button>
</div>
<div class="lights">
  <div class="light green"></div>
  <div class="light red"></div>
</div>

<div class="coin-slot"></div>
<div class="coin" id="coin"></div>

<div class="mini-grid">
  <div></div><div></div><div></div>
  <div></div><div></div><div></div>
  <div></div><div></div><div></div>
</div>

<div class="joystick"></div>
<div class="arrow"></div>
<div class="panel-tray"></div>
</div>

<script>
const items = document.querySelectorAll(".item");
const display = document.getElementById("display");
const panelLED = document.getElementById("panelLED");
const traySlot = document.getElementById("traySlot");

let index = 0;
let credits = 0;
let inputCode = "";
const cols = 3;

/* INIT */
window.onload = () => document.body.focus();

/* COIN */
function insertCoin() {
  credits++;
  display.innerText = "CREDITS: " + credits;
}

/* UPDATE */
function updateSelection() {
  items.forEach(i => i.classList.remove("active"));
  items[index].classList.add("active");
  panelLED.innerText = items[index].dataset.code;
}
updateSelection();

/* JOYSTICK */
document.addEventListener("keydown", (e) => {

  if (credits <= 0) return;

  let row = Math.floor(index / cols);
  let col = index % cols;

  if (e.key === "ArrowRight") col++;
  if (e.key === "ArrowLeft") col--;
  if (e.key === "ArrowDown") row++;
  if (e.key === "ArrowUp") row--;

  col = Math.max(0, Math.min(2, col));
  row = Math.max(0, Math.min(2, row));

  index = row * cols + col;
  updateSelection();

  if (e.key === "Enter") dispense(items[index]);
});

/* KEYPAD */
function pressKey(key) {
  if (credits <= 0) return;

  inputCode += key;
  panelLED.innerText = inputCode;

  if (inputCode.length === 2) {
    const item = [...items].find(i => i.dataset.code === inputCode);

    if (item) dispense(item);
    else display.innerText = "INVALID";

    inputCode = "";
  }
}

/* DISPENSE */
function dispense(item) {

  if (item.dataset.code.startsWith("C")) {
    display.innerText = "🎰 BONUS!";
    const rewards = ["FREE SNACK 🎉","TRY AGAIN","JACKPOT 🏆"];
    setTimeout(()=>{
      display.innerText = rewards[Math.floor(Math.random()*rewards.length)];
      credits--;
    },1000);
    return;
  }

  display.innerText = "DISPENSING...";

  const img = document.createElement("img");
  img.src = item.querySelector("img").src;
  img.className = "tray-item";

  traySlot.innerHTML = "";
  traySlot.appendChild(img);

  setTimeout(()=>{
    display.innerText = "INSERT COIN";
    credits--;
  },1000);
}
</script>

</body>
</html>
