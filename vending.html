<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arcade Vending Machine</title>

<style>
body {
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: sans-serif;
  margin: 0;
}

/* MACHINE */
.machine {
  width: 500px; /* BIGGER */
  height: 700px;
  background: linear-gradient(145deg, #ff00cc, #3333ff);
  border-radius: 30px;
  padding: 20px;
  box-shadow: 0 0 40px #ff00cc;
}

/* DISPLAY */
.display {
  background: #111;
  color: lime;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  font-size: 18px;
}

/* GRID (BIG SCREEN AREA) */
.grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin: 20px 0;
  height: 350px;
}

/* ITEMS */
.item {
  background: white;
  border-radius: 15px;
  padding: 20px;
  text-align: center;
  font-size: 18px;
  transition: transform 0.2s;
}

.item.active {
  outline: 4px solid red;
  transform: scale(1.05);
}

/* CURSOR (JOYSTICK DOT) */
.cursor {
  position: absolute;
  width: 25px;
  height: 25px;
  background: radial-gradient(circle, red, darkred);
  border-radius: 50%;
  border: 3px solid white;
  pointer-events: none;
  transition: 0.15s;
  box-shadow: 0 0 12px red;
}

/* FALLING ITEM */
.falling {
  position: absolute;
  width: 100px;
  left: 50%;
  transform: translateX(-50%);
  animation: fall 1s ease forwards;
  z-index: 10;
  background: white;
  padding: 10px;
  border-radius: 10px;
}

@keyframes fall {
  0% { top: 0; transform: translateX(-50%) rotate(0deg); }
  70% { top: 280px; transform: translateX(-50%) rotate(25deg); }
  100% { top: 330px; transform: translateX(-50%) rotate(10deg); }
}

/* TRAY */
.tray {
  margin-top: 20px;
  background: #222;
  padding: 15px;
  border-radius: 12px;
  color: white;
  text-align: center;
  font-size: 18px;
  min-height: 50px;
}
</style>

</head>

<body>

<div class="machine">

  <div class="display">
    🎮 Use Arrow Keys + Enter to Play
  </div>

  <section class="grid" id="grid" tabindex="0">
    <div class="item">Doritos</div>
    <div class="item">Snickers</div>
    <div class="item">Sprite</div>
    <div class="item">Lays</div>
    <div class="item">KitKat</div>
    <div class="item">Fanta</div>

    <div class="cursor" id="cursor"></div>
  </section>

  <div class="tray" id="tray">Insert coin & select item</div>

</div>

<script>
const items = document.querySelectorAll(".item");
const cursor = document.getElementById("cursor");
const tray = document.getElementById("tray");
const grid = document.getElementById("grid");

let index = 0;
const cols = 3;

/* FORCE FOCUS (IMPORTANT FIX) */
grid.focus();

/* UPDATE CURSOR */
function updateCursor() {
  items.forEach(i => i.classList.remove("active"));
  items[index].classList.add("active");

  const item = items[index];
  const rect = item.getBoundingClientRect();
  const parent = grid.getBoundingClientRect();

  cursor.style.left = (rect.left - parent.left + rect.width/2 - 12) + "px";
  cursor.style.top = (rect.top - parent.top + rect.height/2 - 12) + "px";
}

updateCursor();

/* CONTROLS */
document.addEventListener("keydown", (e) => {

  if (e.key === "ArrowRight") index++;
  if (e.key === "ArrowLeft") index--;
  if (e.key === "ArrowDown") index += cols;
  if (e.key === "ArrowUp") index -= cols;

  if (index < 0) index = 0;
  if (index >= items.length) index = items.length - 1;

  updateCursor();

  if (e.key === "Enter") {
    dispenseItem(items[index].innerText);
  }
});

/* DISPENSE */
function dispenseItem(name) {
  const falling = document.createElement("div");
  falling.className = "falling";
  falling.innerText = name;

  grid.appendChild(falling);

  setTimeout(() => {
    tray.innerHTML = "🎉 You got " + name;
    falling.remove();
  }, 1000);
}
</script>

</body>
</html>
