<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arcade Vending Machine</title>

<style>
body {
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: monospace;
  outline: none;
}

/* MACHINE */
.machine {
  width: 540px;
  background: linear-gradient(145deg, #ff00cc, #3333ff);
  border-radius: 30px;
  padding: 20px;
  box-shadow: 0 0 40px #ff00cc;
}

/* SCREEN */
.display {
  background: #000;
  color: lime;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 10px;
}

/* LED */
.led {
  background: #111;
  color: #00ff00;
  font-size: 28px;
  text-align: center;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

/* ITEMS */
.item {
  background: white;
  border-radius: 15px;
  padding: 10px;
  text-align: center;
  transition: 0.2s;
}

.item img {
  width: 100%;
  height: 90px;
  object-fit: contain;
}

/* ACTIVE */
.item.active {
  outline: 4px solid red;
  transform: scale(1.05);
}

/* KEYPAD */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.keypad button {
  padding: 15px;
  font-size: 18px;
  background: #444;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* COIN */
.coin-btn {
  margin: 10px 0;
  padding: 10px;
  background: gold;
  border: none;
  border-radius: 20px;
  cursor: pointer;
}

/* TRAY */
.tray {
  margin-top: 15px;
  background: #FF6347;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}
</style>

</head>

<body tabindex="0">

<div class="machine">

<div class="display" id="display">INSERT COIN</div>

<button class="coin-btn" onclick="insertCoin()">🪙 Insert Coin</button>

<div class="led" id="led">A1</div>

<section class="grid" id="grid">

  <div class="item" data-code="A1" data-name="Doritos">
    <img src="doritos.jpeg"><p>Doritos</p>
  </div>

  <div class="item" data-code="A2" data-name="Snickers">
    <img src="snickers.jpeg"><p>Snickers</p>
  </div>

  <div class="item" data-code="A3" data-name="Sprite">
    <img src="sprite.jpeg"><p>Sprite</p>
  </div>

  <div class="item" data-code="B1" data-name="Lays">
    <img src="lays.jpeg"><p>Lays</p>
  </div>

  <div class="item" data-code="B2" data-name="Candy">
    <img src="snickers.jpeg"><p>Candy</p>
  </div>

  <div class="item" data-code="B3" data-name="Chips">
    <img src="doritos.jpeg"><p>Chips</p>
  </div>

</section>

<div class="keypad">
  <button onclick="pressKey('A')">A</button>
  <button onclick="pressKey('B')">B</button>
  <button onclick="pressKey('C')">C</button>
  <button onclick="pressKey('1')">1</button>
  <button onclick="pressKey('2')">2</button>
  <button onclick="pressKey('3')">3</button>
</div>

<div class="tray" id="tray">Waiting...</div>

</div>

<script>
const items = document.querySelectorAll(".item");
const led = document.getElementById("led");
const display = document.getElementById("display");
const tray = document.getElementById("tray");

let index = 0;
let hasCoin = false;
let inputCode = "";
const cols = 3;

/* FORCE FOCUS */
window.onload = () => document.body.focus();
document.body.addEventListener("click", () => document.body.focus());

/* COIN */
function insertCoin() {
  hasCoin = true;
  display.innerText = "SELECT ITEM";
}

/* UPDATE */
function updateSelection() {
  items.forEach(i => i.classList.remove("active"));
  const item = items[index];
  item.classList.add("active");
  led.innerText = item.dataset.code;
}
updateSelection();

/* JOYSTICK (FIXED) */
document.addEventListener("keydown", (e) => {

  if (!hasCoin) return;

  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter"].includes(e.key)) {
    e.preventDefault();
  }

  let row = Math.floor(index / cols);
  let col = index % cols;

  if (e.key === "ArrowRight") col++;
  if (e.key === "ArrowLeft") col--;
  if (e.key === "ArrowDown") row++;
  if (e.key === "ArrowUp") row--;

  col = Math.max(0, Math.min(2, col));
  row = Math.max(0, Math.min(1, row));

  index = row * cols + col;

  updateSelection();

  if (e.key === "Enter") {
    dispense(items[index]);
  }
});

/* KEYPAD */
function pressKey(key) {
  if (!hasCoin) return;

  inputCode += key;
  led.innerText = inputCode;

  if (inputCode.length === 2) {
    const item = [...items].find(i => i.dataset.code === inputCode);

    if (item) {
      dispense(item);
    } else {
      display.innerText = "INVALID";
    }

    inputCode = "";
  }
}

/* DISPENSE */
function dispense(item) {
  display.innerText = "DISPENSING...";

  setTimeout(() => {
    tray.innerText = "🎉 " + item.dataset.name;
    display.innerText = "INSERT COIN";
    hasCoin = false;
  }, 1000);
}
</script>

</body>
</html>
