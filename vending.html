<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arcade Vending Machine</title>

<style>
body {
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: monospace;
}

/* MACHINE */
.machine {
  width: 540px;
  height: 760px;
  background: linear-gradient(145deg, #ff00cc, #3333ff);
  border-radius: 30px;
  padding: 20px;
  box-shadow: 0 0 40px #ff00cc;
}

/* 🎞 CRT SCREEN */
.display {
  position: relative;
  background: #000;
  color: lime;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  overflow: hidden;
}

/* scanlines */
.display::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.05) 0px,
    rgba(255,255,255,0.05) 1px,
    transparent 2px
  );
  pointer-events: none;
}

/* curvature glow */
.display::before {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 40px rgba(0,255,0,0.3);
  pointer-events: none;
}

/* 🪙 COIN SLOT */
.coin-slot {
  margin-top: 10px;
  text-align: center;
}

.coin-btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: none;
  background: gold;
  cursor: pointer;
  font-weight: bold;
}

/* GRID */
.grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin: 20px 0;
}

/* ITEMS */
.item {
  background: white;
  border-radius: 15px;
  padding: 10px;
  text-align: center;
}

.item img {
  width: 100%;
  height: 100px;
  object-fit: contain;
}

.item.active {
  outline: 4px solid red;
}

/* CURSOR */
.cursor {
  position: absolute;
  width: 25px;
  height: 25px;
  background: red;
  border-radius: 50%;
  border: 3px solid white;
  pointer-events: none;
  box-shadow: 0 0 10px red;
}

/* FALL */
.falling {
  position: absolute;
  width: 120px;
  left: 50%;
  transform: translateX(-50%);
  animation: fall 1s ease forwards;
  text-align: center;
}

@keyframes fall {
  0% { top: 0; }
  100% { top: 320px; }
}

/* TRAY */
.tray {
  margin-top: 20px;
  background: #222;
  padding: 15px;
  border-radius: 12px;
  color: white;
  text-align: center;
}
</style>

</head>

<body>

<div class="machine">

<div class="display" id="display">
  INSERT COIN TO START
</div>

<div class="coin-slot">
  <button class="coin-btn" onclick="insertCoin()">🪙 Insert Coin</button>
</div>

<section class="grid" id="grid">

  <div class="item" data-name="Doritos">
    <img src="doritos.jpeg">
    <p>Doritos</p>
  </div>

  <div class="item" data-name="Snickers">
    <img src="snickers.jpeg">
    <p>Snickers</p>
  </div>

  <div class="item" data-name="Sprite">
    <img src="sprite.jpeg">
    <p>Sprite</p>
  </div>

  <div class="item" data-name="Lays">
    <img src="lays.jpeg">
    <p>Lays</p>
  </div>

  <div class="item" data-name="Candy">
    <img src="snickers.jpeg">
    <p>Candy</p>
  </div>

  <div class="item" data-name="Chips">
    <img src="doritos.jpeg">
    <p>Chips</p>
  </div>

  <div class="cursor" id="cursor"></div>

</section>

<div class="tray" id="tray">Insert coin to play</div>

</div>

<script>
const items = document.querySelectorAll(".item");
const cursor = document.getElementById("cursor");
const tray = document.getElementById("tray");
const display = document.getElementById("display");
const grid = document.getElementById("grid");

let index = 0;
let hasCoin = false;
const cols = 3;

/* 🪙 INSERT COIN */
function insertCoin() {
  hasCoin = true;
  display.innerHTML = "READY ▶ SELECT ITEM";
  tray.innerHTML = "Use arrow keys + Enter";
}

/* CURSOR */
function updateCursor() {
  items.forEach(i => i.classList.remove("active"));
  items[index].classList.add("active");

  const rect = items[index].getBoundingClientRect();
  const parent = grid.getBoundingClientRect();

  cursor.style.left = (rect.left - parent.left + rect.width/2 - 12) + "px";
  cursor.style.top = (rect.top - parent.top + rect.height/2 - 12) + "px";
}

updateCursor();

/* JOYSTICK */
window.addEventListener("keydown", (e) => {

  if (!hasCoin) return; // 🔒 LOCK UNTIL COIN

  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter"].includes(e.key)) {
    e.preventDefault();
  }

  if (e.key === "ArrowRight") index++;
  if (e.key === "ArrowLeft") index--;
  if (e.key === "ArrowDown") index += cols;
  if (e.key === "ArrowUp") index -= cols;

  if (index < 0) index = 0;
  if (index >= items.length) index = items.length - 1;

  updateCursor();

  if (e.key === "Enter") {
    dispenseItem();
  }
});

/* DISPENSE */
function dispenseItem() {
  const item = items[index];
  const name = item.dataset.name;
  const imgSrc = item.querySelector("img").src;

  const falling = document.createElement("div");
  falling.className = "falling";
  falling.innerHTML = `<img src="${imgSrc}" style="width:80px"><br>${name}`;

  grid.appendChild(falling);

  display.innerHTML = "DISPENSING...";

  setTimeout(() => {
    tray.innerHTML = "🎉 You got " + name;
    display.innerHTML = "INSERT COIN AGAIN";
    falling.remove();
    hasCoin = false;
  }, 1000);
}
</script>

</body>
</html>
