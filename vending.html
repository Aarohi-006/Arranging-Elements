<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arcade Vending Machine</title>

<style>
body {
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: monospace;
}

/* MACHINE */
.machine {
  position: relative;
  width: 540px;
  background: linear-gradient(145deg, #ff00cc, #3333ff);
  border-radius: 30px;
  padding: 20px;
  box-shadow: 0 0 40px #ff00cc;
}

/* DISPLAY */
.display {
  background: black;
  color: #00ff00;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  font-size: 18px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 15px;
  margin-top: 15px;
}

.item {
  background: white;
  border-radius: 15px;
  padding: 10px;
  text-align: center;
}

.item img {
  width: 100%;
  height: 90px;
  object-fit: contain;
}

.item.active {
  outline: 4px solid red;
  transform: scale(1.05);
}

/* KEYPAD */
.keypad {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-top: 15px;
}

.keypad button {
  padding: 12px;
  background: #444;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* TRAY */
.tray {
  margin-top: 20px;
  background: red;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}

/* SIDE PANEL */
.panel {
  position: absolute;
  right: -130px;
  top: 0;
  width: 110px;
  height: 100%;
  background: #ccc;
  border-radius: 20px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

/* LED */
.led {
  background: #111;
  color: #00ff00;
  font-size: 20px;
  padding: 10px;
  border-radius: 10px;
  width: 70px;
  text-align: center;
}

/* LIGHTS */
.lights {
  display: flex;
  gap: 10px;
}
.light {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.green { background: lime; }
.red { background: red; }

/* COIN SLOT */
.slot {
  width: 20px;
  height: 40px;
  background: black;
}

/* COIN */
.coin {
  width: 25px;
  height: 25px;
  background: gold;
  border-radius: 50%;
  position: relative;
  transition: 0.6s;
}

/* INSERT ANIMATION */
.coin.insert {
  transform: translateY(-40px) scale(0.6);
  opacity: 0;
}

/* KEYPAD PANEL */
.mini-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 4px;
}
.mini-grid div {
  width: 20px;
  height: 20px;
  background: #999;
}

/* JOYSTICK */
.joystick {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: radial-gradient(circle, #ddd, #888);
  cursor: pointer;
}

/* ARROW */
.arrow {
  width: 0;
  height: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-top: 25px solid red;
}

/* TRAY SLOT */
.tray-slot {
  width: 60px;
  height: 40px;
  background: #333;
  border-radius: 8px;
}
</style>
</head>

<body tabindex="0">

<div class="machine">


<div class="display" id="display">PRESS START</div>

1</button>
  <button onclick="pressKey('2')"><section class="grid" id="grid">

<!-- A -->
<div class="item" data-code="A1" data-name="Doritos"><img src="doritos.jpeg"><p>Doritos</p></div>
<div class="item" data-code="A2" data-name="Pringles"><img src="pringles.jpeg"><p>Pringles</p></div>
<div class="item" data-code="A3" data-name="Lays"><img src="lays.jpeg"><p>Lays</p></div>

<!-- B -->
<div class="item" data-code="B1" data-name="Coke"><img src="coke.jpeg"><p>Coke</p></div>
<div class="item" data-code="B2" data-name="Sprite"><img src="sprite.jpeg"><p>Sprite</p></div>
<div class="item" data-code="B3" data-name="Red Bull"><img src="red bull.jpeg"><p>Red Bull</p></div>

<!-- C -->
<div class="item" data-code="C1" data-name="Mystery"><img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png"><p>🎁</p></div>
<div class="item" data-code="C2" data-name="XP Candy"><img src="xpcandy.jpeg"><p></p>🍬</div>
<div class="item" data-code="C3" data-name="Jackpot"><img src="https://cdn-icons-png.flaticon.com/512/3468/3468377.png"><p>🏆</p></div>

</section>

<div class="keypad">
  <button onclick="pressKey('A')">A</button>
  <button onclick="pressKey('B')">B</button>
  <button onclick="pressKey('C')">C</button>
  <button onclick="pressKey('1')">2</button>
  <button onclick="pressKey('3')">3</button>
</div>


<div class="tray" id="tray">Waiting...</div>

<!-- RIGHT PANEL -->
<div class="panel">

  <div class="led" id="led">00</div>

  <div class="lights">
    <div class="light green"></div>
    <div class="light red"></div>
  </div>

  <div class="slot"></div>
  <div class="coin" id="coin"></div>

  <div class="mini-grid">
    <div></div><div></div><div></div>
    <div></div><div></div><div></div>
    <div></div><div></div><div></div>
  </div>

  <div class="joystick" onclick="moveJoystick()"></div>

  <div class="arrow"></div>
  <div class="tray-slot"></div>

</div>

</div>

<script>
const items = document.querySelectorAll(".item");
const led = document.getElementById("led");
const tray = document.getElementById("tray");
const coin = document.getElementById("coin");
const display = document.getElementById("display");

let index = 0;
let hasCoin = false;
let input = "";
const cols = 3;

/* INSERT COIN */
coin.onclick = () => {
  coin.classList.add("insert");

  setTimeout(()=>{
    coin.classList.remove("insert");
    hasCoin = true;
    display.innerText = "SELECT ITEM";
  },600);
};

/* UPDATE */
function update(){
  items.forEach(i=>i.classList.remove("active"));
  items[index].classList.add("active");
  led.innerText = items[index].dataset.code;
}
update();

/* JOYSTICK */
function moveJoystick(){
  if(!hasCoin) return;

  index = (index + 1) % items.length;
  update();
}

/* KEYBOARD */
document.addEventListener("keydown", e=>{
  if(!hasCoin) return;

  if(e.key==="ArrowRight") index++;
  if(e.key==="ArrowLeft") index--;

  index = (index + items.length) % items.length;
  update();

  if(e.key==="Enter") dispense(items[index]);
});

/* KEYPAD */
function press(k){
  if(!hasCoin) return;

  input += k;
  led.innerText = input;

  if(input.length===2){
    const item = [...items].find(i=>i.dataset.code===input);
    if(item) dispense(item);
    else display.innerText="INVALID";

    input="";
  }
}

/* DISPENSE */
function dispense(item){
  display.innerText="DISPENSING...";

  setTimeout(()=>{
    tray.innerText="🎉 "+item.dataset.name;
    display.innerText="INSERT COIN";
    hasCoin=false;
  },1000);
}
</script>

</body>
</html>
