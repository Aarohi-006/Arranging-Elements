<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arcade Vending Machine</title>

<style>
body {
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: sans-serif;
}

.machine {
  width: 520px;
  height: 720px;
  background: linear-gradient(145deg, #ff00cc, #3333ff);
  border-radius: 30px;
  padding: 20px;
  box-shadow: 0 0 40px #ff00cc;
}

.display {
  background: #111;
  color: lime;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}

/* GRID */
.grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin: 20px 0;
}

/* ITEMS */
.item {
  background: white;
  border-radius: 15px;
  padding: 10px;
  text-align: center;
}

.item img {
  width: 100%;
  height: 100px;
  object-fit: contain;
}

.item.active {
  outline: 4px solid red;
}

/* CURSOR */
.cursor {
  position: absolute;
  width: 25px;
  height: 25px;
  background: red;
  border-radius: 50%;
  border: 3px solid white;
  pointer-events: none;
  box-shadow: 0 0 10px red;
}

/* FALL */
.falling {
  position: absolute;
  width: 120px;
  left: 50%;
  transform: translateX(-50%);
  animation: fall 1s ease forwards;
  text-align: center;
}

@keyframes fall {
  0% { top: 0; }
  100% { top: 320px; }
}

/* TRAY */
.tray {
  margin-top: 20px;
  background: #222;
  padding: 15px;
  border-radius: 12px;
  color: white;
}
</style>

</head>

<body>

<div class="machine">

<div class="display">🎮 Use Arrow Keys + Enter</div>

<section class="grid" id="grid">

  <div class="item" data-name="Doritos">
    <img src="doritos.jpg">
    <p>Doritos</p>
  </div>

  <div class="item" data-name="Snickers">
    <img src="snickers.jpg">
    <p>Snickers</p>
  </div>

  <div class="item" data-name="Sprite">
    <img src="sprite.jpg">
    <p>Sprite</p>
  </div>

  <div class="item" data-name="Lays">
    <img src="lays.jpg">
    <p>Lays</p>
  </div>

  <div class="item" data-name="Candy">
    <img src="snickers.jpg">
    <p>Candy</p>
  </div>

  <div class="item" data-name="Chips">
    <img src="doritos.jpg">
    <p>Chips</p>
  </div>

  <div class="cursor" id="cursor"></div>

</section>

<div class="tray" id="tray">Insert coin & select item</div>

</div>

<script>
const items = document.querySelectorAll(".item");
const cursor = document.getElementById("cursor");
const tray = document.getElementById("tray");
const grid = document.getElementById("grid");

let index = 0;
const cols = 3;

/* FIX: ALWAYS ENABLE KEYBOARD */
document.body.addEventListener("click", () => window.focus());

function updateCursor() {
  items.forEach(i => i.classList.remove("active"));
  items[index].classList.add("active");

  const rect = items[index].getBoundingClientRect();
  const parent = grid.getBoundingClientRect();

  cursor.style.left = (rect.left - parent.left + rect.width/2 - 12) + "px";
  cursor.style.top = (rect.top - parent.top + rect.height/2 - 12) + "px";
}

updateCursor();

/* JOYSTICK */
window.addEventListener("keydown", (e) => {

  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter"].includes(e.key)) {
    e.preventDefault();
  }

  if (e.key === "ArrowRight") index++;
  if (e.key === "ArrowLeft") index--;
  if (e.key === "ArrowDown") index += cols;
  if (e.key === "ArrowUp") index -= cols;

  if (index < 0) index = 0;
  if (index >= items.length) index = items.length - 1;

  updateCursor();

  if (e.key === "Enter") {
    dispenseItem();
  }
});

function dispenseItem() {
  const item = items[index];
  const name = item.dataset.name;
  const imgSrc = item.querySelector("img").src;

  const falling = document.createElement("div");
  falling.className = "falling";
  falling.innerHTML = `<img src="${imgSrc}" style="width:80px"><br>${name}`;

  grid.appendChild(falling);

  setTimeout(() => {
    tray.innerHTML = "🎉 You got " + name;
    falling.remove();
  }, 1000);
}
</script>

</body>
</html>
