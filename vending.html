<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arcade Vending Machine</title>

<style>
body {
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: monospace;
}

/* MACHINE */
.machine {
  position: relative;
  width: 540px;
  background: linear-gradient(145deg, #ff00cc, #3333ff);
  border-radius: 30px;
  padding: 20px;
  box-shadow: 0 0 40px #ff00cc;
}

/* CRT DISPLAY */
.display {
  background: radial-gradient(#000, #020202);
  color: #00ff99;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  border: 3px solid #00ffcc;
  box-shadow: inset 0 0 20px #00ffcc;
  animation: flicker 1.5s infinite;
}
@keyframes flicker {
  0%,100% { opacity:1; }
  50% { opacity:0.85; }
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-top: 15px;
  position: relative;
}

.item {
  background: white;
  border-radius: 15px;
  padding: 10px;
  text-align: center;
  transition: 0.2s;
}

.item img {
  width: 100%;
  height: 90px;
  object-fit: contain;
}

/* ACTIVE GLOW */
.item.active {
  box-shadow: 0 0 20px red, 0 0 40px yellow;
  transform: scale(1.05);
}

/* DROP ANIMATION */
.fall {
  position: absolute;
  width: 80px;
  animation: drop 1s ease forwards;
}
@keyframes drop {
  0% { top:0; opacity:1; }
  100% { top:250px; opacity:0; }
}

/* KEYPAD */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.keypad button {
  padding: 12px;
  border-radius: 50%;
  background: radial-gradient(circle, #ff3c3c, #800000);
  color: white;
  border: none;
  box-shadow: 0 4px #300, 0 0 10px red;
  cursor: pointer;
}

/* TRAY */
.tray {
  margin-top: 15px;
  background: #FF6347;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
}

/* SIDE PANEL */
.side-panel {
  position: absolute;
  right: -120px;
  top: 0;
  width: 100px;
  height: 100%;
  background: #cfcfcf;
  border-radius: 20px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

/* LED */
.panel-led {
  background: #222;
  color: #00ff00;
  font-size: 20px;
  padding: 8px;
  border-radius: 8px;
  width: 70px;
  text-align: center;
}

/* COIN BUTTON */
.coin-btn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: radial-gradient(circle, gold, orange);
  box-shadow: 0 0 10px gold;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body tabindex="0">

<div class="machine">

<div class="display" id="display">PRESS START</div>

<section class="grid" id="grid">

  <div class="item" data-code="A1" data-name="Doritos"><img src="doritos.jpeg"><p>Doritos</p></div>
  <div class="item" data-code="A2" data-name="Snickers"><img src="snickers.jpeg"><p>Snickers</p></div>
  <div class="item" data-code="A3" data-name="Sprite"><img src="sprite.jpeg"><p>Sprite</p></div>
  <div class="item" data-code="B1" data-name="Lays"><img src="lays.jpeg"><p>Lays</p></div>
  <div class="item" data-code="B2" data-name="Candy"><img src="snickers.jpeg"><p>Candy</p></div>
  <div class="item" data-code="B3" data-name="Chips"><img src="doritos.jpeg"><p>Chips</p></div>

</section>

<div class="keypad">
  <button onclick="pressKey('A')">A</button>
  <button onclick="pressKey('B')">B</button>
  <button onclick="pressKey('1')">1</button>
  <button onclick="pressKey('2')">2</button>
  <button onclick="pressKey('3')">3</button>
</div>

<div class="tray" id="tray">Waiting...</div>

<!-- SIDE PANEL -->
<div class="side-panel">
  <div class="panel-led" id="panelLED">A1</div>

  <!-- COIN HERE -->
  <button class="coin-btn" onclick="insertCoin()">🪙</button>
  <div style="font-size:10px;">INSERT</div>

</div>

</div>

<script>
const items = document.querySelectorAll(".item");
const display = document.getElementById("display");
const tray = document.getElementById("tray");
const panelLED = document.getElementById("panelLED");
const grid = document.getElementById("grid");

let index = 0;
let credits = 0;
let inputCode = "";
const cols = 3;

/* INIT */
window.onload = () => document.body.focus();

/* INSERT COIN */
function insertCoin() {
  credits++;
  display.innerText = "CREDITS: " + credits;
}

/* UPDATE */
function updateSelection() {
  items.forEach(i => i.classList.remove("active"));
  const item = items[index];
  item.classList.add("active");
  panelLED.innerText = item.dataset.code;
}
updateSelection();

/* JOYSTICK */
document.addEventListener("keydown", (e) => {

  if (credits <= 0) return;

  let row = Math.floor(index / cols);
  let col = index % cols;

  if (e.key === "ArrowRight") col++;
  if (e.key === "ArrowLeft") col--;
  if (e.key === "ArrowDown") row++;
  if (e.key === "ArrowUp") row--;

  col = Math.max(0, Math.min(2, col));
  row = Math.max(0, Math.min(1, row));

  index = row * cols + col;

  updateSelection();

  if (e.key === "Enter") {
    dispense(items[index]);
  }
});

/* KEYPAD */
function pressKey(key) {
  if (credits <= 0) return;

  inputCode += key;
  panelLED.innerText = inputCode;

  if (inputCode.length === 2) {
    const item = [...items].find(i => i.dataset.code === inputCode);

    if (item) dispense(item);
    else display.innerText = "INVALID";

    inputCode = "";
  }
}

/* DISPENSE */
function dispense(item) {
  display.innerText = ">> DISPENSING <<";

  const img = item.querySelector("img").src;

  const fall = document.createElement("img");
  fall.src = img;
  fall.className = "fall";

  grid.appendChild(fall);

  setTimeout(() => {
    tray.innerText = "🏆 YOU WON: " + item.dataset.name;
    display.innerText = "INSERT COIN";
    credits--;
    fall.remove();
  }, 1000);
}
</script>

</body>
</html>
