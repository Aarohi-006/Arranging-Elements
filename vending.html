<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arcade Vending Machine</title>

<style>
body {
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: monospace;
}

/* MACHINE */
.machine {
  position: relative;
  width: 540px;
  background: linear-gradient(145deg, #ff00cc, #3333ff);
  border-radius: 30px;
  padding: 20px;
  box-shadow: 0 0 40px #ff00cc;
}

/* SCREEN */
.display {
  background: #000;
  color: lime;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-top: 15px;
}

.item {
  background: white;
  border-radius: 15px;
  padding: 10px;
  text-align: center;
  transition: 0.2s;
}

.item img {
  width: 100%;
  height: 90px;
  object-fit: contain;
}

.item.active {
  outline: 4px solid red;
  transform: scale(1.05);
}

/* KEYPAD */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.keypad button {
  padding: 12px;
  background: #444;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* TRAY */
.tray {
  margin-top: 15px;
  background: #FF6347;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
}

/* COIN */
.coin-btn {
  margin: 10px 0;
  padding: 10px;
  background: gold;
  border-radius: 20px;
  border: none;
  cursor: pointer;
}

/* SIDE PANEL */
.side-panel {
  position: absolute;
  right: -120px;
  top: 0;
  width: 100px;
  height: 100%;
  background: #cfcfcf;
  border-radius: 20px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

/* LED */
.panel-led {
  background: #222;
  color: #00ff00;
  font-size: 20px;
  padding: 8px;
  border-radius: 8px;
  width: 70px;
  text-align: center;
}

/* LIGHTS */
.lights {
  display: flex;
  gap: 8px;
}

.lights span {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.green { background: lime; }
.red { background: red; }

/* SLOT */
.coin-slot {
  width: 20px;
  height: 40px;
  background: black;
}

/* COIN */
.coin {
  width: 25px;
  height: 25px;
  background: gold;
  border-radius: 50%;
}

/* KEYPAD PANEL */
.keypad-panel {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}

.keypad-panel div {
  width: 20px;
  height: 20px;
  background: #999;
}

/* KNOB */
.knob {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: radial-gradient(circle, #ddd, #888);
}

/* ARROW */
.arrow {
  width: 0;
  height: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-top: 25px solid red;
}

/* TRAY SLOT */
.tray-slot {
  width: 60px;
  height: 40px;
  background: #333;
  border-radius: 8px;
}
</style>
</head>

<body tabindex="0">

<div class="machine">

<div class="display" id="display">INSERT COIN</div>
<button class="coin-btn" onclick="insertCoin()">🪙 Insert Coin</button>

<section class="grid" id="grid">

  <div class="item" data-code="A1" data-name="Doritos"><img src="doritos.jpeg"><p>Doritos</p></div>
  <div class="item" data-code="A2" data-name="Snickers"><img src="snickers.jpeg"><p>Snickers</p></div>
  <div class="item" data-code="A3" data-name="Sprite"><img src="sprite.jpeg"><p>Sprite</p></div>
  <div class="item" data-code="B1" data-name="Lays"><img src="lays.jpeg"><p>Lays</p></div>
  <div class="item" data-code="B2" data-name="Candy"><img src="snickers.jpeg"><p>Candy</p></div>
  <div class="item" data-code="B3" data-name="Chips"><img src="doritos.jpeg"><p>Chips</p></div>

</section>

<div class="keypad">
  <button onclick="pressKey('A')">A</button>
  <button onclick="pressKey('B')">B</button>
  <button onclick="pressKey('1')">1</button>
  <button onclick="pressKey('2')">2</button>
  <button onclick="pressKey('3')">3</button>
</div>

<div class="tray" id="tray">Waiting...</div>

<!-- SIDE PANEL -->
<div class="side-panel">
  <div class="panel-led" id="panelLED">A1</div>
  <div class="lights"><span class="green"></span><span class="red"></span></div>
  <div class="coin-slot"></div>
  <div class="coin"></div>
  <div class="keypad-panel">
    <div></div><div></div><div></div>
    <div></div><div></div><div></div>
    <div></div><div></div><div></div>
  </div>
  <div class="knob"></div>
  <div class="arrow"></div>
  <div class="tray-slot"></div>
</div>

</div>

<script>
const items = document.querySelectorAll(".item");
const display = document.getElementById("display");
const tray = document.getElementById("tray");
const panelLED = document.getElementById("panelLED");

let index = 0;
let hasCoin = false;
let inputCode = "";
const cols = 3;

/* FOCUS FIX */
window.onload = () => document.body.focus();
document.body.addEventListener("click", () => document.body.focus());

function insertCoin() {
  hasCoin = true;
  display.innerText = "SELECT ITEM";
}

/* UPDATE */
function updateSelection() {
  items.forEach(i => i.classList.remove("active"));
  const item = items[index];
  item.classList.add("active");

  panelLED.innerText = item.dataset.code;
}
updateSelection();

/* JOYSTICK */
document.addEventListener("keydown", (e) => {

  if (!hasCoin) return;

  let row = Math.floor(index / cols);
  let col = index % cols;

  if (e.key === "ArrowRight") col++;
  if (e.key === "ArrowLeft") col--;
  if (e.key === "ArrowDown") row++;
  if (e.key === "ArrowUp") row--;

  col = Math.max(0, Math.min(2, col));
  row = Math.max(0, Math.min(1, row));

  index = row * cols + col;

  updateSelection();

  if (e.key === "Enter") {
    dispense(items[index]);
  }
});

/* KEYPAD */
function pressKey(key) {
  if (!hasCoin) return;

  inputCode += key;
  panelLED.innerText = inputCode;

  if (inputCode.length === 2) {
    const item = [...items].find(i => i.dataset.code === inputCode);

    if (item) dispense(item);
    else display.innerText = "INVALID";

    inputCode = "";
  }
}

/* DISPENSE */
function dispense(item) {
  display.innerText = "DISPENSING...";

  setTimeout(() => {
    tray.innerText = "🎉 " + item.dataset.name;
    display.innerText = "INSERT COIN";
    hasCoin = false;
  }, 1000);
}
</script>

</body>
</html>
