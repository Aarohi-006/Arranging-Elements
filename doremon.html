<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon Travel Finder</title>

<style>
body {
  margin: 0;
  background: #2D9CDB;
  font-family: "Comic Sans MS", sans-serif;
  text-align: center;
  color: white;
}

/* HEADER GIF */
.header {
  margin-top: 20px;
}

.header img {
  width: 180px;
  border-radius: 20px;
}

/* Title */
h1 {
  margin-top: 10px;
}

/* Door */
.door {
  width: 220px;
  height: 300px;
  background: #FF7BA9;
  margin: 30px auto;
  border-radius: 20px;
  border: 4px solid #1F3A5F;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.door input {
  width: 70%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  outline: none;
  text-align: center;
}

.knob {
  width: 18px;
  height: 18px;
  background: #1F3A5F;
  border-radius: 50%;
  position: absolute;
  right: 12px;
  bottom: 40px;
}

/* Nav */
.nav {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px;
}

.bubble {
  background: white;
  color: black;
  padding: 10px 15px;
  border-radius: 30px;
  box-shadow: 0 5px 0 #1F3A5F;
  cursor: pointer;
  transition: transform 0.2s;
}

.bubble:hover {
  transform: translateY(-5px);
}

/* Cards */
.cards {
  display: flex;
  justify-content: center;
  gap: 15px;
}

.card {
  background: white;
  color: black;
  padding: 20px;
  border-radius: 15px;
  border: 3px solid #1F3A5F;
  width: 120px;
  transition: transform 0.2s;
}

.card:hover {
  transform: scale(1.05);
}

/* Pocket */
.pocket {
  margin-top: 30px;
  background: #FFD84D;
  border: 4px solid #1F3A5F;
  border-radius: 50px;
  padding: 15px 30px;
  font-size: 18px;
  cursor: pointer;
  transition: transform 0.2s;
}

.pocket:hover {
  transform: scale(1.1);
}
</style>

</head>

<body>

<!-- 🔥 HEADER GIF -->
<div class="header">
  <img src="doraemon.gif" alt="Doraemon">
</div>

<h1>🐱 Doraemon Travel Finder</h1>

<!-- Door -->
<div class="door">
  <input type="text" placeholder="Search destination...">
  <div class="knob"></div>
</div>

<!-- Categories -->
<nav class="nav">
  <div class="bubble">🚁 Beach</div>
  <div class="bubble">🚁 City</div>
  <div class="bubble">🚁 Mountains</div>
</nav>

<!-- Results -->
<section class="cards">
  <div class="card">🏝 Bali</div>
  <div class="card">🏔 Swiss</div>
  <div class="card">🏙 NYC</div>
</section>

<!-- Pocket -->
<button class="pocket">🟡 Add to Pocket</button>

<script>
document.querySelector(".pocket").onclick = () => {
  alert("Saved to Doraemon Pocket! 🐱✨");
};
</script>

</body>
</html>
