<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon Travel UI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🐱 Doraemon Travel Finder</h1>

<!-- Door -->
<div class="door">
  <input type="text" placeholder="Search destination...">
  <div class="knob"></div>
</div>

<!-- Categories -->
<nav class="nav">
  <div class="bubble">🚁 Beach</div>
  <div class="bubble">🚁 City</div>
  <div class="bubble">🚁 Mountains</div>
</nav>

<!-- Results -->
<section class="cards">
  <div class="card">🏝 Bali</div>
  <div class="card">🏔 Swiss</div>
  <div class="card">🏙 NYC</div>
</section>

<!-- Pocket -->
<button class="pocket">🟡 Pocket</button>

<script src="script.js"></script>
</body>
</html>
