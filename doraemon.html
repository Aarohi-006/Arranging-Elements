<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon Anywhere Door UI</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Baloo 2', sans-serif;
  background: url("doraemon-bg.jpg") repeat;
  background-size: 300px;
  cursor: none;
}

/* CURSOR */
.cursor {
  position: fixed;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 40%, #aee6ff 100%);
  box-shadow: 0 0 15px #aee6ff;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 9999;
}
.cursor.hover {
  transform: translate(-50%, -50%) scale(1.5);
}

/* UI */
.ui-container {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(15px);
  padding: 30px;
  border-radius: 25px;
}

/* NAV */
.nav {
  display: flex;
  justify-content: center;
  gap: 60px;
  margin-top: 30px;
}

.icon img {
  width: 60px;
}

/* POCKET */
.pocket-container {
  margin-top: 20px;
  position: relative;
  text-align: center;
}

#pocket {
  width: 90px;
}

.pocket-count {
  position: absolute;
  top: 0;
  right: 40%;
  background: red;
  color: white;
  border-radius: 50%;
  padding: 3px 6px;
}

/* SLIDE ITEM */
.fly-img {
  position: fixed;
  width: 60px;
  height: 60px;
  border-radius: 10px;
  object-fit: cover;
  z-index: 999;
  transition: all 0.8s ease;
}
</style>
</head>

<body>

<div class="ui-container">

<h2>Anywhere Door</h2>

<div id="inside"></div>

<div class="nav">
  <div class="icon">Beach</div>
  <div class="icon">City</div>
  <div class="icon">Mountains</div>
</div>

<!-- 🎒 POCKET -->
<div class="pocket-container">
  <img src="pocket.png" id="pocket">
  <div class="pocket-count" id="pocketCount">0</div>
</div>

</div>

<div class="cursor"></div>

<script>
const cursor = document.querySelector(".cursor");
document.addEventListener("mousemove", e => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});

/* DATA */
const data = {
  Beach: [
    {name:"Bali", img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400"}
  ],
  City: [
    {name:"NYC", img:"https://images.unsplash.com/photo-1493244040629-496f6d136cc3?w=400"}
  ],
  Mountains: [
    {name:"Alps", img:"https://images.unsplash.com/photo-1464822759844-d150baec0494?w=400"}
  ]
};

let pocketItems = [];
const inside = document.getElementById("inside");

/* SHOW ITEMS */
document.querySelectorAll(".icon").forEach(icon => {
  icon.addEventListener("click", () => {
    const cat = icon.innerText;

    inside.innerHTML = data[cat].map(p => `
      <div>
        <img src="${p.img}" width="100"><br>
        ${p.name}<br>
        <button onclick="addToPocket('${p.name}','${p.img}')">Add to Pocket</button>
      </div>
    `).join("");
  });
});

/* ADD TO POCKET WITH SLIDE */
function addToPocket(name, img) {

  if (!pocketItems.includes(name)) {
    pocketItems.push(name);
  }

  document.getElementById("pocketCount").innerText = pocketItems.length;

  /* CREATE FLY IMAGE */
  const flying = document.createElement("img");
  flying.src = img;
  flying.className = "fly-img";

  /* START POSITION (CENTER) */
  flying.style.left = "50%";
  flying.style.top = "50%";

  document.body.appendChild(flying);

  const pocket = document.getElementById("pocket");
  const rect = pocket.getBoundingClientRect();

  /* MOVE TO POCKET */
  setTimeout(() => {
    flying.style.left = rect.left + "px";
    flying.style.top = rect.top + "px";
    flying.style.transform = "scale(0.2)";
    flying.style.opacity = "0";
  }, 50);

  setTimeout(() => flying.remove(), 800);
}
</script>

</body>
</html>
