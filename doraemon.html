<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon Anywhere Door</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(#2D9CDB, #BEE9FF);
  font-family: sans-serif;
  text-align: center;
}

/* HEADER */
.header img {
  width: 120px;
}

/* WRAPPER */
.door-wrapper {
  perspective: 1200px;
  position: relative;
}

.door-frame {
  width: 340px;
  height: 230px;
  position: relative;
}

/* 🌍 INSIDE (BEHIND DOOR) */
.inside {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #ffffff, #87CEFA);
  border-radius: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  opacity: 0;
  transition: opacity 0.5s;

  z-index: 1; /* 👈 FIX */
}

.inside.show {
  opacity: 1;
}

/* CARDS */
.results {
  display: flex;
  gap: 10px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 8px;
  width: 90px;
  cursor: pointer;
}

.card img {
  width: 100%;
  border-radius: 8px;
}

/* 🚪 DOOR */
.door {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #FF7BA9;
  border-radius: 20px;
  border: 5px solid #1F3A5F;

  transform-origin: left;
  transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);

  z-index: 5; /* 👈 FIX */
}

/* OPEN */
.door.open {
  transform: rotateY(-120deg);
}

/* CLOSE */
.door.close {
  transform: rotateY(0deg);
}

/* 🔘 KNOB */
.knob {
  width: 18px;
  height: 18px;
  background: #1F3A5F;
  border-radius: 50%;

  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);

  z-index: 6; /* 👈 ABOVE DOOR */
}

/* NAV */
.nav {
  margin-top: 30px;
  display: flex;
  gap: 30px;
}

.icon {
  font-size: 20px;
  cursor: pointer;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* DETAIL */
.detail img {
  width: 120px;
  border-radius: 10px;
}

.detail button {
  margin-top: 10px;
  padding: 8px 12px;
  border-radius: 20px;
  border: none;
  background: #FFD84D;
  cursor: pointer;
}
</style>
</head>

<body>

<div>

<div class="header">
  <img src="doraemon.gif">
</div>

<h2>Anywhere Door</h2>

<div class="door-wrapper">
  <div class="door-frame">

    <div class="inside" id="inside"></div>

    <div class="door" id="door">
      <div class="knob"></div>
    </div>

  </div>
</div>

<div class="nav">
  <div class="icon">🏝 Beach</div>
  <div class="icon">🏙 City</div>
  <div class="icon">🏔 Mountains</div>
</div>

</div>

<script>
const door = document.getElementById("door");
const inside = document.getElementById("inside");

/* DATA */
const data = {
  Beach: [
    {name:"Bali", img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400"},
    {name:"Maldives", img:"https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400"},
       {name:"Santorini", img: "https://images.unsplash.com/photo-1505761671935-60b3a7427bad?w=400&auto=format&fit=crop"
    }
      ],
  City: [
    {name:"NYC", img:"nyc.jpeg"},
    {name:"Tokyo", img:"https://images.unsplash.com/photo-1549692520-acc6669e2f0c?w=400"},
     {name:"Paris", img: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=400&auto=format&fit=crop"
    },
  ],
  Mountains: [
    {name:"Swiss Alps", img: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400&auto=format&fit=crop"},
    {name: "Rocky Mountains", img: "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=400&auto=format&fit=crop"},
    {name:"Himalayas", img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=400"}
  ]
};

/* CLICK */
document.querySelectorAll(".icon").forEach(icon => {
  icon.addEventListener("click", () => {

    const category = icon.innerText.split(" ")[1];

    inside.innerHTML = `
      <div>
        <h3>${category}</h3>
        <div class="results">
          ${data[category].map(place => `
            <div class="card" onclick="expandPlace('${place.name}','${place.img}')">
              <img src="${place.img}">
              <p>${place.name}</p>
            </div>
          `).join("")}
        </div>
      </div>
    `;

    /* RESET */
    door.classList.remove("close");
    door.classList.remove("open");
    inside.classList.remove("show");

    /* OPEN */
    setTimeout(() => door.classList.add("open"), 300);
    setTimeout(() => inside.classList.add("show"), 700);

    /* AUTO CLOSE */
    setTimeout(() => {
      inside.classList.remove("show");
      door.classList.remove("open");
      door.classList.add("close");
    }, 3500);

  });
});

/* DETAIL */
function expandPlace(name, img) {
  inside.innerHTML = `
    <div class="detail">
      <h2>${name}</h2>
      <img src="${img}">
      <br>
      <button onclick="location.reload()">⬅ Back</button>
    </div>
  `;
}
</script>

</body>
</html>
