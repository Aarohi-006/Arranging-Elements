<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon Anywhere Door</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: sans-serif;
  text-align: center;

  background: url("doraemon-bg.jpg") repeat;
  background-size: 300px;

  cursor: none;
}

/* OVERLAY */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(45,156,219,0.25);
  pointer-events: none;
}

/* CURSOR */
.cursor {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: radial-gradient(circle, white 60%, #2D9CDB);
  position: fixed;
  pointer-events: none;
  z-index: 100;
  transform: translate(-50%, -50%);
}

/* GLASS UI */
.ui-container {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  padding: 30px;
  border-radius: 25px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}

/* HEADER */
.header img {
  width: 120px;
}

/* DOOR */
.door-wrapper {
  perspective: 1200px;
  position: relative;
}

.door-frame {
  width: 340px;
  height: 230px;
  position: relative;
}

/* INSIDE */
.inside {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #fff, #87CEFA);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: 0.5s;
  z-index: 1;
}

.inside.show {
  opacity: 1;
}

/* CARDS */
.results {
  display: flex;
  gap: 10px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 8px;
  width: 90px;
  cursor: pointer;
}

.card img {
  width: 100%;
  border-radius: 8px;
}

/* DOOR */
.door {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #FF7BA9;
  border-radius: 20px;
  border: 5px solid #1F3A5F;
  transform-origin: left;
  transition: 0.8s cubic-bezier(0.65,0,0.35,1);
  z-index: 5;
}

.door.open { transform: rotateY(-120deg); }
.door.close { transform: rotateY(0deg); }

/* KNOB */
.knob {
  width: 18px;
  height: 18px;
  background: #1F3A5F;
  border-radius: 50%;
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 6;
}

/* 🚁 COPTER */
.copter {
  position: absolute;
  width: 60px;
  bottom: 10%;
  left: 10%;
  transition: all 1s ease;
  z-index: 10;
}

.copter.fly {
  left: 50%;
  bottom: 50%;
  transform: scale(0.3);
  opacity: 0;
}

/* NAV */
.nav {
  margin-top: 30px;
  display: flex;
  justify-content: center;
  gap: 40px;
}

.icon {
  cursor: pointer;
}

/* POCKET */
.pocket {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 90px;
}

.pocket img {
  width: 100%;
}

/* POCKET ITEM */
.pocket-item {
  position: fixed;
  width: 50px;
  border-radius: 10px;
  transition: 1s ease;
  z-index: 50;
}

/* DETAIL */
.detail img {
  width: 120px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="cursor" id="cursor"></div>

<div class="ui-container">

<div class="header">
  <img src="doraemon.gif">
</div>

<h2>Anywhere Door</h2>

<div class="door-wrapper">
  <div class="door-frame">

    <div class="inside" id="inside"></div>

    <div class="door" id="door">
      <div class="knob"></div>
    </div>

    <!-- 🚁 COPTER -->
    <img src="copter.png" class="copter" id="copter">

  </div>
</div>

<div class="nav">
  <div class="icon">🏝 Beach</div>
  <div class="icon">🏙 City</div>
  <div class="icon">🏔 Mountains</div>
</div>

</div>

<!-- 🧳 POCKET -->
<div class="pocket">
  <img src="pocket.png">
</div>

<script>
const door = document.getElementById("door");
const inside = document.getElementById("inside");
const cursor = document.getElementById("cursor");
const copter = document.getElementById("copter");

/* CURSOR */
document.addEventListener("mousemove", e => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});

/* DATA */
const data = {
  Beach: [
    {name:"Bali", img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400"},
    {name:"Maldives", img:"https://images.unsplash.com/photo-1514282401047-d79a71a590e8?w=400"},
    {name:"Santorini", img: "https://images.unsplash.com/photo-1505761671935-60b3a7427bad?w=400&auto=format&fit=crop"
    }
 ],
  City: [
    {name:"NYC", img:"nyc.jpeg"},
    {name:"Tokyo", img:"https://images.unsplash.com/photo-1549692520-acc6669e2f0c?w=400"},
    {name:"Paris", img: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=400&auto=format&fit=crop"
    }
    ],
    Mountains: [
    {name:"Swiss Alps", img: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400&auto=format&fit=crop"},
    {name: "Rocky Mountains", img: "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=400&auto=format&fit=crop"},
    {name:"Himalayas", img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=400"}
  ]
 
};

/* CLICK */
document.querySelectorAll(".icon").forEach(icon => {
  icon.addEventListener("click", () => {

    const category = icon.innerText.split(" ")[1];

    inside.innerHTML = `
      <div>
        <h3>${category}</h3>
        <div class="results">
          ${data[category].map(place => `
            <div class="card" onclick="expandPlace('${place.name}','${place.img}')">
              <img src="${place.img}">
              <p>${place.name}</p>
            </div>
          `).join("")}
        </div>
      </div>
    `;

    /* RESET */
    door.classList.remove("open","close");
    inside.classList.remove("show");
    copter.classList.remove("fly");

    /* 🚁 COPTER FIRST */
    setTimeout(()=>copter.classList.add("fly"),100);

    /* DOOR */
    setTimeout(()=>door.classList.add("open"),600);
    setTimeout(()=>inside.classList.add("show"),1000);

    /* CLOSE */
    setTimeout(()=>{
      inside.classList.remove("show");
      door.classList.remove("open");
      door.classList.add("close");
      copter.classList.remove("fly");
    },4000);
  });
});

/* DETAIL */
function expandPlace(name, img) {
  inside.innerHTML = `
    <div class="detail">
      <h2>${name}</h2>
      <img src="${img}">
      <br>
      <button onclick="addToPocket('${img}')">🧳 Add to Pocket</button>
      <br>
      <button onclick="location.reload()">⬅ Back</button>
    </div>
  `;
}

/* POCKET */
function addToPocket(img) {
  const item = document.createElement("img");
  item.src = img;
  item.className = "pocket-item";

  item.style.left = "50%";
  item.style.top = "50%";

  document.body.appendChild(item);

  setTimeout(()=>{
    item.style.left = "92%";
    item.style.top = "88%";
    item.style.transform = "scale(0.2)";
  },50);

  setTimeout(()=>item.remove(),1000);
}
</script>

</body>
</html>
