<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon Anywhere Door UI</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Baloo 2', sans-serif;
  background: url("doraemon-bg.jpg") repeat;
  background-size: 300px;
  cursor: none;
}

/* 🟦 DORAEMON CURSOR */
.cursor {
  position: fixed;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 40%, #aee6ff 100%);
  border: 2px solid #1F3A5F;
  box-shadow: 0 0 12px #aee6ff;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 9999;
}

.cursor::after {
  content: "";
  position: absolute;
  width: 6px;
  height: 12px;
  background: #1F3A5F;
  border-radius: 3px;
  top: 4px;
  left: 50%;
  transform: translateX(-50%);
}

.cursor.click {
  transform: translate(-50%, -50%) scale(0.8);
}

/* CONTAINER */
.ui-container {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(15px);
  padding: 30px;
  border-radius: 25px;
  text-align: center;
}

/* HEADER */
.header img {
  width: 130px;
}

/* DOOR */
.door-wrapper {
  perspective: 1200px;
}

.door-frame {
  width: 340px;
  height: 230px;
  position: relative;
}

/* INSIDE */
.inside {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #fff, #87CEFA);
  border-radius: 20px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  opacity: 0;
  transition: 0.5s;
}
.inside.show { opacity: 1; }

/* CARDS */
.card {
  background: white;
  border-radius: 10px;
  padding: 8px;
  width: 90px;
}
.card img {
  width: 100%;
  border-radius: 8px;
}

/* DOOR */
.door {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #FF7BA9;
  border-radius: 20px;
  border: 5px solid #1F3A5F;
  transform-origin: left;
  transition: transform 0.8s ease;
  z-index: 2;
}
.door.open {
  transform: rotateY(-120deg);
}

/* KNOB */
.doraemon-knob {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff, #bde3ff);
  border: 3px solid #1F3A5F;
  position: absolute;
  right: 18px;
  top: 55%;
  transform: translateY(-50%);
  z-index: 3;
  cursor: pointer;
}

/* COPTER */
.copter {
  position: absolute;
  width: 60px;
  bottom: 20%;
  left: 10%;
  transition: all 1s ease;
}
.copter.fly {
  bottom: 50%;
  left: 45%;
  transform: scale(0.3);
  opacity: 0;
}

/* NAV */
.nav {
  margin-top: 30px;
  display: flex;
  justify-content: center;
  gap: 60px;
}
.icon img {
  width: 60px;
}

/* POCKET */
.pocket-container {
  margin-top: 20px;
  position: relative;
}
#pocket {
  width: 90px;
}

.pocket-count {
  position: absolute;
  top: 0;
  right: 45%;
  background: red;
  color: white;
  border-radius: 50%;
  padding: 3px 6px;
}

/* FLY ANIMATION */
.fly-img {
  position: fixed;
  width: 60px;
  height: 60px;
  border-radius: 10px;
  object-fit: cover;
  transition: 0.8s;
  z-index: 999;
}
</style>
</head>

<body>

<div class="ui-container">

<div class="header">
  <img src="doraemon.gif">
</div>

<h2>Anywhere Door</h2>

<div class="door-wrapper">
  <div class="door-frame">

    <div class="inside" id="inside"></div>

    <div class="door" id="door"></div>

    <div class="doraemon-knob" id="knob"></div>

  </div>
</div>

<img src="copter.png" class="copter" id="copter">

<div class="nav">
  <div class="icon"><img src="locket.png"><br>Beach</div>
  <div class="icon"><img src="locket.png"><br>City</div>
  <div class="icon"><img src="locket.png"><br>Mountains</div>
</div>

<div class="pocket-container">
  <img src="pocket.png" id="pocket">
  <div class="pocket-count" id="pocketCount">0</div>
</div>

</div>

<div class="cursor"></div>

<script>
const cursor = document.querySelector(".cursor");

/* CURSOR MOVE */
document.addEventListener("mousemove", e=>{
  cursor.style.left = e.clientX+"px";
  cursor.style.top = e.clientY+"px";
});

/* CLICK EFFECT */
document.addEventListener("mousedown", ()=>cursor.classList.add("click"));
document.addEventListener("mouseup", ()=>cursor.classList.remove("click"));

const door = document.getElementById("door");
const inside = document.getElementById("inside");
const copter = document.getElementById("copter");

let pocketItems = [];

/* DATA */
const data = {
  Beach: [
    {name:"🏝 Bali", img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400"},
    {name:"🏖 Maldives", img:"https://images.unsplash.com/photo-1514282401047-d79a71a590e8?w=400"}
    {name: "🏖 Santorini", img: "https://images.unsplash.com/photo-1505761671935-60b3a7427bad?w=400&auto=format&fit=crop"},
  ],
  
  City: [
    {name:"🏙 NYC", img:"nyc.jpeg"},
    {name:"🏙 Tokyo", img:"https://images.unsplash.com/photo-1549692520-acc6669e2f0c?w=400"}
      {name:"🏙 Paris", img: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=400&auto=format&fit=crop" },
  ],
 
  Mountains: [
    {
      name: "⛰ Himalayas",
      img: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=400&auto=format&fit=crop"
    },
    {
      name: "🏔 Swiss Alps",
      img: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400&auto=format&fit=crop"
    },
    {
      name: "⛰ Rocky Mountains",
      img: "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=400&auto=format&fit=crop"
    },
  ]
};


/* CATEGORY CLICK */
document.querySelectorAll(".icon").forEach(icon=>{
  icon.onclick=()=>{
    const cat = icon.innerText.trim();

    inside.innerHTML = data[cat].map(p=>`
      <div class="card">
        <img src="${p.img}">
        <p>${p.name}</p>
        <button onclick="addToPocket('${p.name}','${p.img}')">Add</button>
      </div>
    `).join("");

    door.classList.remove("open");
    inside.classList.remove("show");
    copter.classList.remove("fly");

    setTimeout(()=>copter.classList.add("fly"),100);
    setTimeout(()=>door.classList.add("open"),600);
    setTimeout(()=>inside.classList.add("show"),900);
  }
});

/* KNOB CLICK */
document.getElementById("knob").onclick = () => {
  door.classList.add("open");
  setTimeout(()=>inside.classList.add("show"),600);
};

/* ADD TO POCKET */
function addToPocket(name,img){

  if(!pocketItems.includes(name)) pocketItems.push(name);
  document.getElementById("pocketCount").innerText = pocketItems.length;

  const flying = document.createElement("img");
  flying.src = img;
  flying.className = "fly-img";
  flying.style.left = "50%";
  flying.style.top = "50%";

  document.body.appendChild(flying);

  const rect = document.getElementById("pocket").getBoundingClientRect();

  setTimeout(()=>{
    flying.style.left = rect.left + "px";
    flying.style.top = rect.top + "px";
    flying.style.transform = "scale(0.2)";
    flying.style.opacity = "0";
  },50);

  setTimeout(()=>flying.remove(),800);
}
</script>

</body>
</html>
