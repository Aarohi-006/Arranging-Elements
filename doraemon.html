<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon Portal UI</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(#2D9CDB, #BEE9FF);
  font-family: sans-serif;
  text-align: center;
  cursor: none;
  perspective: 1000px;
}

/* HEADER GIF */
.header img {
  width: 150px;
  margin-bottom: 10px;
}

/* 🚪 DOOR SYSTEM */
.door-container {
  position: relative;
  width: 320px;
  height: 200px;
}

/* PORTAL (behind) */
.portal {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #ffffff, #87CEFA);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  opacity: 0;
  transition: opacity 0.5s;
}

.portal.show {
  opacity: 1;
}

/* DOOR */
.door {
  width: 100%;
  height: 100%;
  background: #FF7BA9;
  border-radius: 20px;
  border: 5px solid #1F3A5F;
  position: absolute;
  transform-origin: left center;
  transition: transform 0.8s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

/* OPEN FULL */
.door.open {
  transform: rotateY(-110deg);
}

.door input {
  width: 70%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  text-align: center;
}

/* KNOB */
.knob {
  width: 18px;
  height: 18px;
  background: #1F3A5F;
  border-radius: 50%;
  position: absolute;
  right: 12px;
  bottom: 30px;
}

/* 🌍 CARDS */
.card {
  background: white;
  padding: 15px;
  border-radius: 15px;
  border: 3px solid #1F3A5F;
}

/* 🚁 FLOAT ICONS */
.nav {
  margin-top: 40px;
  display: flex;
  gap: 30px;
}

.icon {
  font-size: 22px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-15px); }
}

/* 🚁 DORAEMON COPTER CURSOR */
.cursor {
  position: fixed;
  width: 30px;
  height: 30px;
  background: red;
  border-radius: 50%;
  pointer-events: none;
  box-shadow: 0 0 10px yellow;
}

/* propeller */
.cursor::before {
  content: "";
  position: absolute;
  width: 40px;
  height: 6px;
  background: yellow;
  top: -10px;
  left: -5px;
  border-radius: 5px;
  animation: spin 0.2s linear infinite;
}

/* center rod */
.cursor::after {
  content: "";
  position: absolute;
  width: 4px;
  height: 10px;
  background: #333;
  top: -6px;
  left: 13px;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <img src="./doraemon.gif">
</div>

<h2>Anywhere Door</h2>

<!-- DOOR -->
<div class="door-container">

  <div class="portal" id="portal">
    <div class="card">🏝 Bali</div>
    <div class="card">🏔 Swiss</div>
    <div class="card">🏙 NYC</div>
  </div>

  <div class="door" id="door">
    <input type="text" placeholder="Where to go?">
    <div class="knob"></div>
  </div>

</div>

<!-- NAV -->
<div class="nav">
  <div class="icon">🚁 Beach</div>
  <div class="icon">🚁 City</div>
  <div class="icon">🚁 Mountains</div>
</div>

<!-- CURSOR -->
<div class="cursor"></div>

<script>
const door = document.getElementById("door");
const portal = document.getElementById("portal");
const input = document.querySelector("input");

/* OPEN DOOR */
input.addEventListener("focus", () => {
  door.classList.add("open");
  portal.classList.add("show");
});

/* CLOSE */
document.addEventListener("click", (e) => {
  if (!door.contains(e.target)) {
    door.classList.remove("open");
    portal.classList.remove("show");
  }
});

/* CURSOR FOLLOW */
const cursor = document.querySelector(".cursor");

document.addEventListener("mousemove", (e) => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});
</script>

</body>
</html>
