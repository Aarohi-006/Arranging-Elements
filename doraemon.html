<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon Portal UI</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(#2D9CDB, #BEE9FF);
  font-family: sans-serif;
  text-align: center;
  overflow: hidden;
  cursor: none;
}

/* HEADER */
.header img {
  width: 130px;
  margin-bottom: 10px;
}

/* TITLE */
h1 {
  margin-bottom: 20px;
}

/* 🚪 DOOR */
.door-container {
  position: relative;
  width: 320px;
  height: 200px;
}

.door {
  width: 100%;
  height: 100%;
  background: #FF7BA9;
  border-radius: 20px;
  border: 5px solid #1F3A5F;
  position: absolute;
  transform-origin: left;
  transition: transform 0.7s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

/* OPEN */
.door.open {
  transform: perspective(800px) rotateY(-70deg);
}

.door input {
  width: 70%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  text-align: center;
}

.knob {
  width: 18px;
  height: 18px;
  background: #1F3A5F;
  border-radius: 50%;
  position: absolute;
  right: 12px;
  bottom: 30px;
}

/* 🌍 PORTAL RESULTS */
.portal {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #ffffff, #87CEFA);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  opacity: 0;
  transition: opacity 0.5s;
}

/* SHOW RESULTS */
.portal.show {
  opacity: 1;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 15px;
  border: 3px solid #1F3A5F;
}

/* 🚁 FLOATING ICONS */
.nav {
  margin-top: 40px;
  display: flex;
  gap: 30px;
}

.icon {
  font-size: 22px;
  animation: float 3s ease-in-out infinite;
}

/* FLOAT ANIMATION */
@keyframes float {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-15px); }
}

/* DELAYS */
.icon:nth-child(2) { animation-delay: 0.5s; }
.icon:nth-child(3) { animation-delay: 1s; }

/* 🚁 CURSOR */
.cursor {
  position: fixed;
  width: 40px;
  height: 40px;
  background: yellow;
  border-radius: 50%;
  pointer-events: none;
}

.cursor::after {
  content: "";
  position: absolute;
  width: 30px;
  height: 6px;
  background: #333;
  top: -8px;
  left: 5px;
  border-radius: 5px;
  animation: spin 0.3s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="header">
  <img src="./doraemon.gif">
</div>

<h1>Doraemon Anywhere Door</h1>

<!-- DOOR + PORTAL -->
<div class="door-container">
  
  <!-- PORTAL (behind door) -->
  <div class="portal" id="portal">
    <div class="card">🏝 Bali</div>
    <div class="card">🏔 Swiss</div>
    <div class="card">🏙 NYC</div>
  </div>

  <!-- DOOR -->
  <div class="door" id="door">
    <input type="text" placeholder="Where to go?">
    <div class="knob"></div>
  </div>

</div>

<!-- FLOATING ICONS -->
<div class="nav">
  <div class="icon">🚁 Beach</div>
  <div class="icon">🚁 City</div>
  <div class="icon">🚁 Mountains</div>
</div>

<!-- CURSOR -->
<div class="cursor"></div>

<script>
const door = document.getElementById("door");
const input = document.querySelector("input");
const portal = document.getElementById("portal");

/* OPEN DOOR */
input.addEventListener("focus", () => {
  door.classList.add("open");
  portal.classList.add("show");
});

/* CLOSE */
document.addEventListener("click", (e) => {
  if (!door.contains(e.target)) {
    door.classList.remove("open");
    portal.classList.remove("show");
  }
});

/* CURSOR */
const cursor = document.querySelector(".cursor");

document.addEventListener("mousemove", (e) => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});
</script>

</body>
</html>
