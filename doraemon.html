<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon Travel Finder</title>

<style>
body {
  margin: 0;
  background: linear-gradient(#2D9CDB, #6EC6FF);
  font-family: "Comic Sans MS", sans-serif;
  text-align: center;
  color: white;
  cursor: none; /* hide default cursor */
}

/* HEADER */
.header img {
  width: 160px;
  margin-top: 20px;
}

/* TITLE */
h1 {
  margin: 10px;
}

/* 🚪 ANYWHERE DOOR */
.door {
  width: 220px;
  height: 300px;
  background: #FF7BA9;
  margin: 30px auto;
  border-radius: 20px;
  border: 5px solid #1F3A5F;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset -10px 0 rgba(0,0,0,0.1);
}

.door input {
  width: 70%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  text-align: center;
}

/* Door knob */
.knob {
  width: 20px;
  height: 20px;
  background: #1F3A5F;
  border-radius: 50%;
  position: absolute;
  right: 15px;
  bottom: 40px;
}

/* 🚁 NAV */
.nav {
  display: flex;
  justify-content: center;
  gap: 15px;
}

.bubble {
  background: white;
  color: black;
  padding: 10px 15px;
  border-radius: 30px;
  box-shadow: 0 5px 0 #1F3A5F;
}

/* 🌍 CARDS */
.cards {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 20px;
}

.card {
  background: white;
  color: black;
  padding: 20px;
  border-radius: 15px;
  border: 3px solid #1F3A5F;
}

/* 🧳 POCKET */
.pocket {
  margin-top: 30px;
  background: #FFD84D;
  border: 4px solid #1F3A5F;
  border-radius: 50px;
  padding: 15px 30px;
  font-size: 18px;
}

/* 🚁 CUSTOM CURSOR */
.cursor {
  position: fixed;
  width: 40px;
  height: 40px;
  background: radial-gradient(circle, yellow 40%, orange 60%);
  border-radius: 50%;
  pointer-events: none;
  box-shadow: 0 0 10px yellow;
}

.cursor::after {
  content: "";
  position: absolute;
  width: 30px;
  height: 6px;
  background: #333;
  top: -8px;
  left: 5px;
  border-radius: 5px;
}
</style>
</head>

<body>

<!-- HEADER GIF -->
<div class="header">
  <img src="./doraemon.gif" alt="Doraemon">
</div>

<h1>🐱 Doraemon Travel Finder</h1>

<!-- DOOR -->
<div class="door">
  <input type="text" placeholder="Anywhere Door...">
  <div class="knob"></div>
</div>

<!-- NAV -->
<nav class="nav">
  <div class="bubble">🚁 Beach</div>
  <div class="bubble">🚁 City</div>
  <div class="bubble">🚁 Mountains</div>
</nav>

<!-- RESULTS -->
<section class="cards">
  <div class="card">🏝 Bali</div>
  <div class="card">🏔 Swiss</div>
  <div class="card">🏙 NYC</div>
</section>

<!-- POCKET -->
<button class="pocket">🧳 Pocket</button>

<!-- CUSTOM CURSOR -->
<div class="cursor"></div>

<script>
/* Cursor follow */
const cursor = document.querySelector(".cursor");

document.addEventListener("mousemove", (e) => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});

/* Pocket interaction */
document.querySelector(".pocket").onclick = () => {
  alert("Saved to Doraemon Pocket! 🐱✨");
};
</script>

</body>
</html>
