<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon Anywhere Door UI</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Baloo 2', sans-serif;
  background: url("doraemon-bg.jpg") repeat;
  background-size: 300px;
  cursor: none;
}

/* CURSOR */
.cursor {
  position: fixed;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 40%, #aee6ff 100%);
  box-shadow: 0 0 15px #aee6ff;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 9999;
}
.cursor.hover {
  transform: translate(-50%, -50%) scale(1.5);
}

/* CONTAINER */
.ui-container {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(15px);
  padding: 30px;
  border-radius: 25px;
  text-align: center;
}

/* HEADER */
.header img {
  width: 120px;
}

h2 {
  color: #1F3A5F;
}

/* DOOR */
.door-frame {
  width: 340px;
  height: 230px;
  position: relative;
}

.inside {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #fff, #87CEFA);
  border-radius: 20px;
  opacity: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: 0.5s;
}
.inside.show { opacity: 1; }

.door {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #FF7BA9;
  border-radius: 20px;
  transform-origin: left;
  transition: 0.8s;
}
.door.open { transform: rotateY(-120deg); }

/* COPTER */
.copter {
  position: absolute;
  width: 60px;
  bottom: 20%;
  left: 10%;
  transition: 1s;
}
.copter.fly {
  left: 45%;
  top: 40%;
  transform: scale(0.3);
  opacity: 0;
}

/* NAV */
.nav {
  margin-top: 30px;
  display: flex;
  justify-content: center;
  gap: 50px;
}
.icon img { width: 60px; }

/* POCKET */
.pocket-container {
  margin-top: 20px;
  position: relative;
}
#pocket { width: 90px; }
.pocket-count {
  position: absolute;
  top: 0;
  right: 45%;
  background: red;
  color: white;
  border-radius: 50%;
  padding: 3px 6px;
}

/* FLY IMAGE */
.fly-img {
  position: fixed;
  width: 60px;
  height: 60px;
  border-radius: 10px;
  object-fit: cover;
  transition: 0.8s;
  z-index: 999;
}
</style>
</head>

<body>

<div class="ui-container">

<div class="header">
  <img src="doraemon.gif">
</div>

<h2>Anywhere Door</h2>

<div class="door-frame">
  <div class="inside" id="inside"></div>
  <div class="door" id="door"></div>
</div>

<img src="copter.png" class="copter" id="copter">

<div class="nav">
  <div class="icon">Beach</div>
  <div class="icon">City</div>
  <div class="icon">Mountains</div>
</div>

<!-- POCKET -->
<div class="pocket-container">
  <img src="pocket.png" id="pocket">
  <div class="pocket-count" id="pocketCount">0</div>
</div>

</div>

<div class="cursor"></div>

<script>
const cursor = document.querySelector(".cursor");
document.addEventListener("mousemove", e=>{
  cursor.style.left = e.clientX+"px";
  cursor.style.top = e.clientY+"px";
});

const door = document.getElementById("door");
const inside = document.getElementById("inside");
const copter = document.getElementById("copter");

let pocketItems = [];

const data = {
  Beach:[{name:"Bali",img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400"}],
  City:[{name:"NYC",img:"https://images.unsplash.com/photo-1493244040629-496f6d136cc3?w=400"}],
  Mountains:[{name:"Alps",img:"https://images.unsplash.com/photo-1464822759844-d150baec0494?w=400"}]
};

document.querySelectorAll(".icon").forEach(icon=>{
  icon.onclick=()=>{
    const cat=icon.innerText;

    inside.innerHTML=data[cat].map(p=>`
      <div>
        <img src="${p.img}" width="100"><br>
        ${p.name}<br>
        <button onclick="addToPocket('${p.name}','${p.img}')">Add</button>
      </div>
    `).join("");

    door.classList.remove("open");
    inside.classList.remove("show");
    copter.classList.remove("fly");

    setTimeout(()=>copter.classList.add("fly"),100);
    setTimeout(()=>door.classList.add("open"),500);
    setTimeout(()=>inside.classList.add("show"),800);
  }
});

function addToPocket(name,img){

  if(!pocketItems.includes(name)) pocketItems.push(name);

  document.getElementById("pocketCount").innerText=pocketItems.length;

  const flying=document.createElement("img");
  flying.src=img;
  flying.className="fly-img";
  flying.style.left="50%";
  flying.style.top="50%";

  document.body.appendChild(flying);

  const rect=document.getElementById("pocket").getBoundingClientRect();

  setTimeout(()=>{
    flying.style.left=rect.left+"px";
    flying.style.top=rect.top+"px";
    flying.style.transform="scale(0.2)";
    flying.style.opacity="0";
  },50);

  setTimeout(()=>flying.remove(),800);
}
</script>

</body>
</html>
