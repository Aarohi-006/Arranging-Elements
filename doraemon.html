<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon Anywhere Door UI</title>

<style>
body {
  margin: 0;
  height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: sans-serif;
  text-align: center;

  /* 🟦 BACKGROUND SKIN */
  background: url("doraemon-bg.jpg") repeat;
  background-size: 300px;
}

/* OVERLAY */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(45,156,219,0.2);
  pointer-events: none;
}

/* GLASS CONTAINER */
.ui-container {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  padding: 30px;
  border-radius: 25px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}

/* HEADER */
.header img {
  width: 120px;
}

/* DOOR */
.door-wrapper {
  perspective: 1200px;
  position: relative;
}

.door-frame {
  width: 340px;
  height: 230px;
  position: relative;
}

/* INSIDE */
.inside {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #ffffff, #87CEFA);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: 0.5s;
}

.inside.show {
  opacity: 1;
}

/* CARDS */
.results {
  display: flex;
  gap: 10px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 8px;
  width: 90px;
  cursor: pointer;
}

.card img {
  width: 100%;
  border-radius: 8px;
}

/* DOOR */
.door {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #FF7BA9;
  border-radius: 20px;
  border: 5px solid #1F3A5F;
  transform-origin: left;
  transition: transform 0.8s ease;
  z-index: 2;
  box-shadow: 0 0 20px rgba(255,123,169,0.6);
}

.door.open {
  transform: rotateY(-120deg);
}

.knob {
  width: 18px;
  height: 18px;
  background: #1F3A5F;
  border-radius: 50%;
  position: absolute;
  right: 15px;
  bottom: 40px;
}

/* COPTER */
.copter {
  position: absolute;
  width: 60px;
  bottom: 20%;
  left: 10%;
  transition: all 1s ease;
}

.copter.fly {
  bottom: 50%;
  left: 45%;
  transform: scale(0.3);
  opacity: 0;
}

/* NAV */
.nav {
  margin-top: 30px;
  display: flex;
  gap: 30px;
}

.icon {
  font-size: 20px;
  animation: float 3s ease-in-out infinite;
  cursor: pointer;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* DETAIL */
.detail img {
  width: 120px;
  border-radius: 10px;
}

.detail button {
  margin-top: 10px;
  padding: 8px 12px;
  border-radius: 20px;
  border: none;
  background: #FFD84D;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="ui-container">

<div class="header">
  <img src="doraemon.gif">
</div>

<h2>Anywhere Door</h2>

<div class="door-wrapper">
  <div class="door-frame">

    <div class="inside" id="inside"></div>

    <div class="door" id="door">
      <div class="knob"></div>
    </div>

  </div>
</div>

<img src="copter.png" class="copter" id="copter">

<div class="nav">
  <div class="icon">🚁 Beach</div>
  <div class="icon">🚁 City</div>
  <div class="icon">🚁 Mountains</div>
</div>

</div>

<script>
const door = document.getElementById("door");
const copter = document.getElementById("copter");
const inside = document.getElementById("inside");

const data = {
  Beach: [
    {name:"🏝 Bali", img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e"},
    {name:"🏖 Maldives", img:"https://images.unsplash.com/photo-1506744038136-46273834b3fb"}
  ],
  City: [
    {name:"🏙 NYC", img:"timo-wagner-fT6-YkB0nfg-unsplash.jpg"},
    {name:"🏙 Tokyo", img:"https://images.unsplash.com/photo-1549692520-acc6669e2f0c"}
  ],
  Mountains: [
    {name:"🏔 Alps", img:"simon-fitall-xWxh7hsgJVA-unsplash.jpg"},
    {name:"⛰ Himalayas", img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"}
  ]
};

let pocket = [];

document.querySelectorAll(".icon").forEach(icon => {
  icon.addEventListener("click", () => {

    const category = icon.textContent.split(" ")[1];

    inside.innerHTML = `
      <div>
        <h3>${category}</h3>
        <div class="results">
          ${data[category].map(place => `
            <div class="card" onclick="expandPlace('${place.name}','${place.img}')">
              <img src="${place.img}">
              <p>${place.name}</p>
            </div>
          `).join("")}
        </div>
      </div>
    `;

    door.classList.remove("open");
    inside.classList.remove("show");
    copter.classList.remove("fly");

    setTimeout(() => copter.classList.add("fly"), 100);
    setTimeout(() => door.classList.add("open"), 600);
    setTimeout(() => inside.classList.add("show"), 900);
  });
});

function expandPlace(name, img) {
  inside.innerHTML = `
    <div class="detail">
      <h2>${name}</h2>
      <img src="${img}">
      <br>
      <button onclick="addToPocket('${name}')">🧳 Add to Pocket</button>
      <br>
      <button onclick="location.reload()">⬅ Back</button>
    </div>
  `;
}

function addToPocket(place) {
  if (!pocket.includes(place)) pocket.push(place);
  alert(place + " added to pocket 🧳");
}
</script>

</body>
</html>
