<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon Anywhere Door UI</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(#2D9CDB, #BEE9FF);
  font-family: sans-serif;
  text-align: center;
}

/* HEADER */
.header img {
  width: 130px;
  margin-bottom: 10px;
}

/* WRAPPER */
.door-wrapper {
  perspective: 1200px;
  position: relative;
}

.door-frame {
  width: 340px;
  height: 230px;
  position: relative;
}

/* 🌍 PORTAL */
.inside {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #ffffff, #87CEFA);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.5s;
}

.inside.show {
  opacity: 1;
}

/* CARDS */
.results {
  display: flex;
  gap: 10px;
}

.card {
  background: white;
  border-radius: 10px;
  border: 2px solid #1F3A5F;
  padding: 8px;
  width: 90px;
  cursor: pointer;
}

.card img {
  width: 100%;
  border-radius: 8px;
}

/* 🚪 DOOR */
.door {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #FF7BA9;
  border-radius: 20px;
  border: 5px solid #1F3A5F;
  transform-origin: left;
  transition: transform 0.8s ease;
  z-index: 2;
}

.door.open {
  transform: rotateY(-120deg);
}

.knob {
  width: 18px;
  height: 18px;
  background: #1F3A5F;
  border-radius: 50%;
  position: absolute;
  right: 15px;
  bottom: 40px;
}

/* 🚁 COPTER */
.copter {
  position: absolute;
  width: 60px;
  bottom: 20%;
  left: 10%;
  transition: all 1s ease;
}

.copter.fly {
  bottom: 50%;
  left: 45%;
  transform: scale(0.3);
  opacity: 0;
}

/* NAV */
.nav {
  margin-top: 40px;
  display: flex;
  gap: 30px;
}

.icon {
  font-size: 22px;
  animation: float 3s ease-in-out infinite;
  cursor: pointer;
}

@keyframes float {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-15px); }
}

/* DETAIL VIEW */
.detail img {
  width: 120px;
  border-radius: 10px;
}

.detail button {
  padding: 8px 12px;
  margin-top: 10px;
  border-radius: 20px;
  border: none;
  background: #FFD84D;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="header">
  <img src="./doraemon.gif">
</div>

<h2>Anywhere Door</h2>

<div class="door-wrapper">
  <div class="door-frame">

    <div class="inside" id="inside"></div>

    <div class="door" id="door">
      <div class="knob"></div>
    </div>

  </div>
</div>

<img src="copter.png" class="copter" id="copter">

<div class="nav">
  <div class="icon">🚁 Beach</div>
  <div class="icon">🚁 City</div>
  <div class="icon">🚁 Mountains</div>
</div>

<script>
const door = document.getElementById("door");
const copter = document.getElementById("copter");
const inside = document.getElementById("inside");

/* DATA WITH IMAGES */
const data = {
  Beach: [
    {name:"🏝 Bali", img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e"},
    {name:"🏖 Maldives", img:"https://images.unsplash.com/photo-1506744038136-46273834b3fb"},
    {name:"🌊 Goa", img:"https://images.unsplash.com/photo-1501785888041-af3ef285b470"}
  ],
  City: [
    {name:"🏙 NYC", img:"https://images.unsplash.com/photo-1493244040629-496f6d136cc3"},
    {name:"🏙 Tokyo", img:"https://images.unsplash.com/photo-1549692520-acc6669e2f0c"},
    {name:"🏙 Paris", img:"https://images.unsplash.com/photo-1502602898657-3e91760cbb34"}
  ],
  Mountains: [
    {name:"🏔 Swiss", img:"https://images.unsplash.com/photo-1501785888041-af3ef285b470"},
    {name:"⛰ Himalayas", img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"},
    {name:"🏔 Alps", img:"https://images.unsplash.com/photo-1464822759844-d150baec0494"}
  ]
};

let pocket = [];

const icons = document.querySelectorAll(".icon");

icons.forEach(icon => {
  icon.addEventListener("click", () => {

    const category = icon.textContent.trim().split(" ")[1];

    inside.innerHTML = `
      <div>
        <h3>${category}</h3>
        <div class="results">
          ${data[category].map(place => `
            <div class="card" onclick="expandPlace('${place.name}', '${place.img}')">
              <img src="${place.img}">
              <p>${place.name}</p>
            </div>
          `).join("")}
        </div>
      </div>
    `;

    door.classList.remove("open");
    inside.classList.remove("show");
    copter.classList.remove("fly");

    setTimeout(() => copter.classList.add("fly"), 100);
    setTimeout(() => door.classList.add("open"), 600);
    setTimeout(() => inside.classList.add("show"), 900);

  });
});

/* DETAIL VIEW */
function expandPlace(name, img) {
  inside.innerHTML = `
    <div class="detail">
      <h2>${name}</h2>
      <img src="${img}">
      <br>
      <button onclick="addToPocket('${name}')">🧳 Add to Pocket</button>
      <br>
      <button onclick="history.back()">⬅ Back</button>
    </div>
  `;
}

/* POCKET */
function addToPocket(place) {
  if (!pocket.includes(place)) {
    pocket.push(place);
  }
  alert(place + " added to pocket 🧳");
}
</script>

</body>
</html>
