<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon Anywhere Door UI</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(#2D9CDB, #BEE9FF);
  font-family: sans-serif;
  text-align: center;
}

/* HEADER GIF */
.header img {
  width: 140px;
  margin-bottom: 10px;
}

/* TITLE */
h1 {
  margin-bottom: 20px;
}

/* WRAPPER */
.door-wrapper {
  perspective: 1200px;
  position: relative;
}

/* FRAME */
.door-frame {
  width: 320px;
  height: 200px;
  position: relative;
}

/* 🌍 INSIDE PORTAL */
.inside {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #ffffff, #87CEFA);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.5s;
}

/* SHOW */
.inside.show {
  opacity: 1;
}

/* RESULTS */
.results {
  display: flex;
  gap: 10px;
}

.card {
  background: white;
  padding: 10px;
  border-radius: 10px;
  border: 2px solid #1F3A5F;
}

/* 🚪 DOOR */
.door {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #FF7BA9;
  border-radius: 20px;
  border: 5px solid #1F3A5F;
  transform-origin: left;
  transition: transform 0.8s ease;
  z-index: 2;
}

/* OPEN */
.door.open {
  transform: rotateY(-120deg);
}

/* KNOB */
.knob {
  width: 18px;
  height: 18px;
  background: #1F3A5F;
  border-radius: 50%;
  position: absolute;
  right: 15px;
  bottom: 40px;
}

/* 🚁 COPTER */
.copter {
  position: absolute;
  width: 60px;
  bottom: 20%;
  left: 10%;
  transition: all 1s ease;
}

/* FLY */
.copter.fly {
  bottom: 50%;
  left: 45%;
  transform: scale(0.3);
  opacity: 0;
}

/* FLOATING CATEGORY ICONS */
.nav {
  margin-top: 40px;
  display: flex;
  gap: 30px;
}

.icon {
  font-size: 22px;
  animation: float 3s ease-in-out infinite;
}

.icon:nth-child(2) { animation-delay: 0.5s; }
.icon:nth-child(3) { animation-delay: 1s; }

@keyframes float {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-15px); }
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
  <img src="./doraemon.gif" alt="Doraemon">
</div>

<h1>Anywhere Door</h1>

<!-- DOOR SYSTEM -->
<div class="door-wrapper">

  <div class="door-frame">

    <!-- 🌍 INSIDE -->
    <div class="inside" id="inside">
      <div class="results">
        <div class="card">🏝 Bali</div>
        <div class="card">🏔 Swiss</div>
        <div class="card">🏙 NYC</div>
      </div>
    </div>

    <!-- 🚪 DOOR -->
    <div class="door" id="door">
      <div class="knob"></div>
    </div>

  </div>

</div>

<!-- 🚁 COPTER -->
<img src="copter.png" class="copter" id="copter">

<!-- FLOATING ICONS -->
<div class="nav">
  <div class="icon">🚁 Beach</div>
  <div class="icon">🚁 City</div>
  <div class="icon">🚁 Mountains</div>
</div>

<script>
const door = document.getElementById("door");
const copter = document.getElementById("copter");
const inside = document.getElementById("inside");

/* CLICK INTERACTION */
door.addEventListener("click", () => {

  // Copter flies
  copter.classList.add("fly");

  // Door opens
  setTimeout(() => {
    door.classList.add("open");
  }, 600);

  // Show results
  setTimeout(() => {
    inside.classList.add("show");
  }, 900);

});
</script>

</body>
</html>
