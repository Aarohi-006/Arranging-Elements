<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinema Khoj</title>

<style>
body {
  margin: 0;
  background: #7b0f0f;
  font-family: serif;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  width: 80%;
  font-size: 28px;
  margin: 20px 0;
}

/* 🎬 CLAPPER */
.clapper {
  width: 320px;
  perspective: 600px;
}

.flap {
  height: 40px;
  background: black;
  transform-origin: top;
  transition: 0.4s;
}

.clap {
  transform: rotateX(-60deg);
}

.clapper-body {
  background: #eee;
  padding: 15px;
  border-radius: 10px;
}

.clapper input, .clapper select {
  width: 90%;
  margin: 5px 0;
}

/* 🎞 FILM STRIP */
.film-container {
  overflow: hidden;
  width: 80%;
  margin: 30px auto;
}

.film-strip {
  display: flex;
  gap: 30px;
  width: max-content;
  animation: scroll 25s linear infinite;
}

.film-strip:hover {
  animation-play-state: paused;
}

@keyframes scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.frame {
  background: #c9a66b;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.2s;
}

.frame:hover {
  transform: scale(1.1);
}

.frame img {
  width: 120px;
  height: 170px;
  object-fit: cover;
  display: block;
}

/* 🎟 TICKET */
.ticket {
  margin: 20px;
  width: 260px;
  background: #f5deb3;
  color: black;
  padding: 20px;
  border-radius: 10px;
  transition: 0.4s;
}

.torn {
  transform: rotate(-5deg) scale(0.95);
  opacity: 0.7;
}

/* 🍿 GENRES */
.genres button {
  margin: 10px;
  padding: 10px 15px;
  border-radius: 20px;
  border: none;
  background: #ffcc00;
  cursor: pointer;
}

/* NAV */
nav {
  margin: 30px;
}

nav span {
  margin: 0 15px;
}
</style>

</head>

<body>

<div class="header">
  <div>Cinema</div>
  <div>Khoj</div>
</div>

<!-- 🎬 CLAPPER -->
<div class="clapper">
  <div class="flap" id="flap"></div>
  <div class="clapper-body">
    <input id="search" placeholder="🎬 Search movie">
    <select>
      <option>Year</option>
      <option>1950s</option>
      <option>1960s</option>
    </select>
    <input placeholder="Actor / Director">
  </div>
</div>

<!-- 🎞 FILM STRIP -->
<div class="film-container">
  <section class="film-strip" id="filmStrip"></section>
</div>

<!-- 🎟 TICKET -->
<aside class="ticket" id="ticket">
  🎟 Select a movie
</aside>

<!-- 🍿 GENRE -->
<div class="genres">
  <button>🍿 Action</button>
  <button>🍿 Romance</button>
  <button>🍿 Drama</button>
</div>

<!-- NAV -->
<nav>
  <span>💡 Films</span>
  <span>🎞 Actors</span>
  <span>🎵 Music</span>
  <span>🎥 Directors</span>
</nav>

<script>

/* 🎬 MOVIE DATA */
const movies = [
  {
    name: "Mother India",
    genre: "Drama",
    img: "motherindia.jpg"
  },
  {
    name: "Pyaasa",
    genre: "Romance",
    img: "pyaasa.jpg"
  },
  {
    name: "Guide",
    genre: "Drama",
    img: "guide.jpg"
  },
  {
    name: "Sholay",
    genre: "Action",
    img: "sholay.jpg"
  }
];

const strip = document.getElementById("filmStrip");
const ticket = document.getElementById("ticket");
const flap = document.getElementById("flap");
const search = document.getElementById("search");

/* 🎞 RENDER */
function renderMovies(list) {
  strip.innerHTML = "";

  list.forEach(movie => {
    const div = document.createElement("div");
    div.className = "frame";

    div.innerHTML = `<img src="${movie.img}">`;

    div.onclick = () => selectMovie(movie.name);

    strip.appendChild(div);
  });

  /* duplicate for smooth loop */
  list.forEach(movie => {
    const div = document.createElement("div");
    div.className = "frame";
    div.innerHTML = `<img src="${movie.img}">`;
    strip.appendChild(div);
  });
}

renderMovies(movies);

/* 🎬 SEARCH */
search.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {

    flap.classList.add("clap");
    setTimeout(() => flap.classList.remove("clap"), 300);

    const value = search.value.toLowerCase();

    const filtered = movies.filter(m =>
      m.name.toLowerCase().includes(value)
    );

    renderMovies(filtered.length ? filtered : movies);
  }
});

/* 🍿 GENRE */
document.querySelectorAll(".genres button").forEach(btn => {
  btn.addEventListener("click", () => {
    const genre = btn.innerText.replace("🍿","").trim();
    const filtered = movies.filter(m => m.genre === genre);
    renderMovies(filtered);
  });
});

/* 🎟 TICKET */
function selectMovie(movie) {
  ticket.classList.add("torn");

  setTimeout(() => {
    ticket.innerHTML = `🎟 ${movie}<br>Now Showing ✨`;
    ticket.classList.remove("torn");
  }, 300);
}

</script>

</body>
</html>
