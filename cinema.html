<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinema Khoj</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #7b0f0f;
  font-family: 'Playfair Display', serif;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  width: 80%;
  font-size: 32px;
  margin: 20px 0;
  font-family: 'Bebas Neue', sans-serif;
}

/* 🎞 ROW */
.film-row {
  width: 90%;
  margin: 20px 0;
}

/* TITLE */
.row-title {
  font-family: 'Bebas Neue';
  font-size: 24px;
  margin-bottom: 10px;
  border-bottom: 2px solid gold;
}

/* 👇 THIS FIXES SCROLL */
.viewport {
  overflow: hidden;
  width: 100%;
}

/* STRIP */
.strip {
  display: flex;
  gap: 20px;
  width: max-content;
  animation: scroll 20s linear infinite;
}

.strip:hover {
  animation-play-state: paused;
}

/* FIXED ANIMATION */
@keyframes scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* MOVIE */
.frame {
  background: #c9a66b;
  padding: 8px;
  border-radius: 10px;
  cursor: pointer;
  flex-shrink: 0; /* IMPORTANT */
}

.frame img {
  width: 140px;
  height: 200px;
  object-fit: cover;
  display: block;
}

/* TICKET */
.ticket {
  margin: 20px;
  width: 300px;
  height: 160px;
  background: url("ticket.png") no-repeat center;
  background-size: contain;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ticket-text {
  color: #3b2a1a;
}
</style>
</head>

<body>

<div class="header">
  <div>Cinema</div>
  <div>Khoj</div>
</div>

<!-- 🎞 BOLLYWOOD -->
<div class="film-row">
  <div class="row-title">Bollywood</div>
  <div class="viewport">
    <div class="strip" id="bolly"></div>
  </div>
</div>

<!-- 🎞 HOLLYWOOD -->
<div class="film-row">
  <div class="row-title">Hollywood</div>
  <div class="viewport">
    <div class="strip" id="holly"></div>
  </div>
</div>

<!-- 🎟 -->
<div class="ticket">
  <div class="ticket-text" id="ticket">🎟 Select a movie</div>
</div>

<script>

const movies = [
  {name:"Mother India", industry:"Bollywood", img:"https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=400"},
  {name:"Sholay", industry:"Bollywood", img:"https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=400"},
  {name:"DDLJ", industry:"Bollywood", img:"https://images.unsplash.com/photo-1518929458119-e5bf444c30f4?w=400"},
  {name:"Lagaan", industry:"Bollywood", img:"https://images.unsplash.com/photo-1492724441997-5dc865305da7?w=400"},

  {name:"Godfather", industry:"Hollywood", img:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400"},
  {name:"Titanic", industry:"Hollywood", img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400"},
  {name:"Dark Knight", industry:"Hollywood", img:"https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?w=400"},
  {name:"Psycho", industry:"Hollywood", img:"https://images.unsplash.com/photo-1517602302552-471fe67acf66?w=400"}
];

const bolly = document.getElementById("bolly");
const holly = document.getElementById("holly");
const ticket = document.getElementById("ticket");

/* BUILD STRIP */
function buildStrip(list, container){
  container.innerHTML = "";

  list.forEach(m=>{
    const div = document.createElement("div");
    div.className = "frame";
    div.innerHTML = `<img src="${m.img}">`;
    div.onclick = ()=> ticket.innerHTML = "🎟 " + m.name;
    container.appendChild(div);
  });

  /* DUPLICATE FOR LOOP */
  container.innerHTML += container.innerHTML;
}

buildStrip(movies.filter(m=>m.industry==="Bollywood"), bolly);
buildStrip(movies.filter(m=>m.industry==="Hollywood"), holly);

</script>

</body>
</html>
