<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinema Khoj</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #7b0f0f;
  font-family: 'Playfair Display', serif;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  width: 80%;
  font-size: 32px;
  margin: 20px 0;
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 3px;
}

/* CLAPPER */
.clapper {
  width: 320px;
  perspective: 600px;
}

.flap {
  height: 40px;
  background: black;
  transform-origin: top;
  transition: 0.4s;
}

.clap {
  transform: rotateX(-60deg);
}

.clapper-body {
  background: #eee;
  padding: 15px;
  border-radius: 10px;
}

.clapper input, .clapper select {
  width: 90%;
  margin: 5px 0;
}

/* 🎞 GRID */
.film-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  width: 85%;
  margin: 30px auto;
}

.column {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.column h2 {
  font-family: 'Bebas Neue';
  letter-spacing: 2px;
  border-bottom: 2px solid gold;
}

/* ERA ROW */
.era-row {
  background: rgba(255,255,255,0.05);
  padding: 10px;
  border-radius: 10px;
}

.era-title {
  font-family: 'Bebas Neue';
  margin-bottom: 5px;
}

/* MOVIES */
.movie-row {
  display: flex;
  gap: 10px;
}

.frame {
  background: #c9a66b;
  padding: 6px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.frame img {
  width: 80px;
  height: 110px;
  object-fit: cover;
}

.frame:hover {
  transform: scale(1.1);
}

/* TICKET */
.ticket {
  margin: 20px;
  width: 300px;
  height: 160px;
  background: url("ticket.png") no-repeat center;
  background-size: contain;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ticket-text {
  width: 70%;
  font-size: 14px;
  color: #3b2a1a;
  font-weight: bold;
  text-align: center;
}

.torn {
  transform: rotate(-3deg) scale(0.95);
}

/* GENRES */
.genres button {
  margin: 10px;
  padding: 10px 15px;
  border-radius: 20px;
  border: none;
  background: #ffcc00;
  cursor: pointer;
}

/* NAV */
nav {
  margin: 30px;
}
</style>
</head>

<body>

<div class="header">
  <div>Cinema</div>
  <div>Khoj</div>
</div>

<!-- CLAPPER -->
<div class="clapper">
  <div class="flap" id="flap"></div>
  <div class="clapper-body">
    <input id="search" placeholder="🎬 Search movie">

    <select id="yearFilter">
      <option value="">All Eras</option>
      <option value="1950s">1950s</option>
      <option value="1960s">1960s</option>
      <option value="1970s">1970s</option>
      <option value="1980s">1980s</option>
      <option value="1990s">1990s</option>
      <option value="2000s">2000s</option>
    </select>

    <input placeholder="Actor / Director">
  </div>
</div>

<!-- 🎞 GRID -->
<div class="film-grid" id="filmGrid"></div>

<!-- 🎟 TICKET -->
<aside class="ticket" id="ticketBox">
  <div class="ticket-text" id="ticket">
    🎟 Select a movie
  </div>
</aside>

<!-- 🍿 GENRE -->
<div class="genres">
  <button>🍿 Action</button>
  <button>🍿 Romance</button>
  <button>🍿 Drama</button>
</div>

<nav>
  💡 Films | 🎞 Actors | 🎵 Music | 🎥 Directors
</nav>

<script>

/* DATA */
const movies = [
  {name:"Mother India", genre:"Drama", era:"1950s", industry:"Bollywood", img:"https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=300"},
  {name:"12 Angry Men", genre:"Drama", era:"1950s", industry:"Hollywood", img:"https://images.unsplash.com/photo-1524985069026-dd778a71c7b4?w=300"},

  {name:"Mughal-e-Azam", genre:"Romance", era:"1960s", industry:"Bollywood", img:"https://images.unsplash.com/photo-1505685296765-3a2736de412f?w=300"},
  {name:"Psycho", genre:"Drama", era:"1960s", industry:"Hollywood", img:"https://images.unsplash.com/photo-1517602302552-471fe67acf66?w=300"},

  {name:"Sholay", genre:"Action", era:"1970s", industry:"Bollywood", img:"https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=300"},
  {name:"Godfather", genre:"Drama", era:"1970s", industry:"Hollywood", img:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=300"},

  {name:"Mr India", genre:"Action", era:"1980s", industry:"Bollywood", img:"https://images.unsplash.com/photo-1497032205916-ac775f0649ae?w=300"},
  {name:"Back to Future", genre:"Action", era:"1980s", industry:"Hollywood", img:"https://images.unsplash.com/photo-1502134249126-9f3755a50d78?w=300"},

  {name:"DDLJ", genre:"Romance", era:"1990s", industry:"Bollywood", img:"https://images.unsplash.com/photo-1518929458119-e5bf444c30f4?w=300"},
  {name:"Titanic", genre:"Romance", era:"1990s", industry:"Hollywood", img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=300"},

  {name:"Lagaan", genre:"Drama", era:"2000s", industry:"Bollywood", img:"https://images.unsplash.com/photo-1492724441997-5dc865305da7?w=300"},
  {name:"Dark Knight", genre:"Action", era:"2000s", industry:"Hollywood", img:"https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?w=300"}
];

const ticket = document.getElementById("ticket");
const ticketBox = document.getElementById("ticketBox");
const flap = document.getElementById("flap");
const search = document.getElementById("search");
const yearFilter = document.getElementById("yearFilter");

/* GRID RENDER */
function renderMovies(list) {
  const grid = document.getElementById("filmGrid");
  grid.innerHTML = "";

  const eras = ["1950s","1960s","1970s","1980s","1990s","2000s"];
  const industries = ["Bollywood","Hollywood"];

  industries.forEach(industry => {

    const col = document.createElement("div");
    col.className = "column";

    const title = document.createElement("h2");
    title.innerText = industry;
    col.appendChild(title);

    eras.forEach(era => {

      const row = document.createElement("div");
      row.className = "era-row";

      const eraTitle = document.createElement("div");
      eraTitle.className = "era-title";
      eraTitle.innerText = era;

      const movieRow = document.createElement("div");
      movieRow.className = "movie-row";

      const filtered = list.filter(m => m.era === era && m.industry === industry);

      filtered.forEach(m => {
        const div = document.createElement("div");
        div.className = "frame";
        div.innerHTML = `<img src="${m.img}">`;
        div.onclick = () => selectMovie(m.name);
        movieRow.appendChild(div);
      });

      row.appendChild(eraTitle);
      row.appendChild(movieRow);
      col.appendChild(row);

    });

    grid.appendChild(col);
  });
}

renderMovies(movies);

/* SEARCH */
search.addEventListener("keydown", e => {
  if(e.key === "Enter"){
    flap.classList.add("clap");
    setTimeout(()=>flap.classList.remove("clap"),300);

    const val = search.value.toLowerCase();
    renderMovies(movies.filter(m => m.name.toLowerCase().includes(val)));
  }
});

/* ERA FILTER */
yearFilter.addEventListener("change", ()=>{
  const val = yearFilter.value;
  renderMovies(val ? movies.filter(m => m.era === val) : movies);
});

/* GENRE */
document.querySelectorAll(".genres button").forEach(btn=>{
  btn.onclick = ()=>{
    const g = btn.innerText.replace("🍿","").trim();
    renderMovies(movies.filter(m => m.genre === g));
  };
});

/* TICKET */
function selectMovie(name){
  ticketBox.classList.add("torn");

  setTimeout(()=>{
    ticket.innerHTML = `🎟 ${name}<br>Now Showing ✨`;
    ticketBox.classList.remove("torn");
  },300);
}
</script>

</body>
</html>
