<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinema Khoj – Bollywood Archive</title>

<style>
body {
  margin: 0;
  background: #7b0f0f;
  font-family: serif;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* HEADER */
.header {
  font-size: 32px;
  margin: 20px;
}

/* 🎬 CLAPPER */
.clapper {
  width: 320px;
  perspective: 600px;
}

.flap {
  height: 40px;
  background: black;
  transform-origin: top;
  transition: 0.4s;
}

.clap { transform: rotateX(-60deg); }

.clapper-body {
  background: #eee;
  padding: 15px;
  border-radius: 10px;
}

.clapper input {
  width: 90%;
  margin: 5px 0;
}

/* 🎞 FILM STRIP */
.container {
  width: 90%;
  margin-top: 20px;
}

.era {
  margin-bottom: 30px;
}

.era h3 {
  margin-left: 20px;
  color: #ffcc00;
}

/* horizontal scroll */
.film-strip {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  padding: 10px 20px;
}

.frame {
  background: #c9a66b;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.frame:hover {
  transform: scale(1.1);
}

.frame img {
  width: 120px;
  height: 170px;
  object-fit: cover;
}

/* 🎟 TICKET */
.ticket {
  margin: 20px;
  width: 280px;
  height: 150px;
  background: url("ticket.png") no-repeat center;
  background-size: contain;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ticket-text {
  color: black;
  font-weight: bold;
  text-align: center;
}

/* 🍿 GENRES */
.genres button {
  margin: 5px;
  padding: 10px;
  border-radius: 20px;
  border: none;
  background: #ffcc00;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">🎬 Cinema Khoj</div>

<!-- 🎬 CLAPPER -->
<div class="clapper">
  <div class="flap" id="flap"></div>
  <div class="clapper-body">
    <input id="search" placeholder="Search Bollywood film...">
  </div>
</div>

<!-- 🎞 FILM STRIPS -->
<div class="container" id="container"></div>

<!-- 🎟 TICKET -->
<div class="ticket">
  <div class="ticket-text" id="ticket">🎟 Select a movie</div>
</div>

<!-- 🍿 GENRES -->
<div class="genres">
  <button onclick="filterGenre('All')">All</button>
  <button onclick="filterGenre('Drama')">Drama</button>
  <button onclick="filterGenre('Romance')">Romance</button>
  <button onclick="filterGenre('Action')">Action</button>
</div>

<script>
const flap = document.getElementById("flap");
const container = document.getElementById("container");
const ticket = document.getElementById("ticket");

/* 🎬 DATA */
const moviesByEra = {
  "1950s": [
    { name: "Mother India", genre: "Drama", img: "https://upload.wikimedia.org/wikipedia/en/5/51/Mother_India_poster.jpg" },
    { name: "Pyaasa", genre: "Romance", img: "https://upload.wikimedia.org/wikipedia/en/3/3b/Pyaasa_poster.jpg" }
  ],
  "1960s": [
    { name: "Mughal-e-Azam", genre: "Drama", img: "https://upload.wikimedia.org/wikipedia/en/1/1c/Mughal-e-Azam_poster.jpg" },
    { name: "Guide", genre: "Drama", img: "https://upload.wikimedia.org/wikipedia/en/7/7d/Guide_film_poster.jpg" }
  ],
  "1970s": [
    { name: "Sholay", genre: "Action", img: "https://upload.wikimedia.org/wikipedia/en/5/52/Sholay.jpg" },
    { name: "Deewaar", genre: "Drama", img: "https://upload.wikimedia.org/wikipedia/en/9/9f/Deewaar.jpg" }
  ],
  "1980s": [
    { name: "Mr India", genre: "Action", img: "https://upload.wikimedia.org/wikipedia/en/8/8e/Mr._India_film_poster.jpg" },
    { name: "QSQT", genre: "Romance", img: "https://upload.wikimedia.org/wikipedia/en/3/3d/Qsqt.jpg" }
  ],
  "1990s": [
    { name: "DDLJ", genre: "Romance", img: "https://upload.wikimedia.org/wikipedia/en/8/80/Dilwale_Dulhania_Le_Jayenge_poster.jpg" },
    { name: "HAHK", genre: "Drama", img: "https://upload.wikimedia.org/wikipedia/en/7/7e/Hum_Aapke_Hain_Koun..!jpg" }
  ],
  "2000s": [
    { name: "Lagaan", genre: "Drama", img: "https://upload.wikimedia.org/wikipedia/en/b/b6/Lagaan.jpg" },
    { name: "K3G", genre: "Drama", img: "https://upload.wikimedia.org/wikipedia/en/4/4b/K3G_poster.jpg" }
  ]
};

/* 🎞 RENDER */
function renderMovies(filter = "All") {
  container.innerHTML = "";

  Object.keys(moviesByEra).forEach(era => {
    const eraDiv = document.createElement("div");
    eraDiv.className = "era";

    const filteredMovies = moviesByEra[era].filter(m =>
      filter === "All" || m.genre === filter
    );

    if (filteredMovies.length === 0) return;

    eraDiv.innerHTML = `
      <h3>${era}</h3>
      <div class="film-strip">
        ${filteredMovies.map(movie => `
          <div class="frame" onclick="selectMovie('${movie.name}')">
            <img src="${movie.img}">
          </div>
        `).join("")}
      </div>
    `;

    container.appendChild(eraDiv);
  });
}

renderMovies();

/* 🎟 SELECT */
function selectMovie(name) {
  ticket.innerHTML = `🎟 ${name}<br>Now Showing ✨`;
}

/* 🍿 FILTER */
function filterGenre(genre) {
  renderMovies(genre);
}

/* 🎬 SEARCH */
document.getElementById("search").addEventListener("keydown", e => {
  if (e.key === "Enter") {

    flap.classList.add("clap");
    setTimeout(()=>flap.classList.remove("clap"),300);

    const value = e.target.value.toLowerCase();

    container.innerHTML = "";

    Object.keys(moviesByEra).forEach(era => {
      const matches = moviesByEra[era].filter(m =>
        m.name.toLowerCase().includes(value)
      );

      if (matches.length) {
        const div = document.createElement("div");
        div.innerHTML = `
          <h3>${era}</h3>
          <div class="film-strip">
            ${matches.map(m => `
              <div class="frame" onclick="selectMovie('${m.name}')">
                <img src="${m.img}">
              </div>
            `).join("")}
          </div>
        `;
        container.appendChild(div);
      }
    });
  }
});
</script>

</body>
</html>
