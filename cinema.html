<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinema Khoj – Fixed Scroll</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Playfair Display', serif;
  color: white;
  overflow: hidden;

  background:
    radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px),
    #5a0c0c;
  background-size: 4px 4px;
}

/* HEADER */
.header {
  text-align: center;
  font-family: 'Bebas Neue';
  font-size: 40px;
  margin: 20px;
}

/* 🎞 CONTAINER */
.film-container {
  width: 100%;
  overflow: hidden;
  position: relative;
}

/* 🎞 STRIP */
.film-strip {
  display: flex;
  gap: 30px;
  width: max-content;
  animation: scroll 60s linear infinite;
}

/* KEY FIX */
@keyframes scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* FRAME */
.frame {
  background: #c9a66b;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
}

.frame img {
  width: 130px;
  height: 180px;
  object-fit: cover;
}

/* 🎟 TICKET */
.ticket {
  margin: 20px auto;
  width: 300px;
  height: 160px;
  background: url("ticket.png") no-repeat center;
  background-size: contain;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ticket-text {
  color: black;
  font-weight: bold;
}

/* ANIMATION */
.ticket.animate {
  animation: tear 0.4s;
}

@keyframes tear {
  50% { transform: scale(0.9) rotate(-3deg); }
}
</style>
</head>

<body>

<div class="header">🎬 Cinema Khoj</div>

<div class="film-container">
  <div class="film-strip" id="filmStrip"></div>
</div>

<div class="ticket" id="ticketBox">
  <div class="ticket-text" id="ticket">🎟 Select a movie</div>
</div>

<script>
const strip = document.getElementById("filmStrip");
const ticket = document.getElementById("ticket");
const ticketBox = document.getElementById("ticketBox");

/* 🎬 DATA */
const movies = [
  { name:"Mother India", img:"motherindia.jpg" },
  { name:"Pyaasa", img:"pyaasa.jpg" },
  { name:"Mughal-e-Azam", img:"https://upload.wikimedia.org/wikipedia/en/1/1c/Mughal-e-Azam_poster.jpg" },
  { name:"Guide", img:"guide.jpg" },
  { name:"Sholay", img:"sholay.jpg" },
  { name:"Deewaar", img:"https://upload.wikimedia.org/wikipedia/en/9/9f/Deewaar.jpg" },
  { name:"DDLJ", img:"https://upload.wikimedia.org/wikipedia/en/8/80/Dilwale_Dulhania_Le_Jayenge_poster.jpg" },
  { name:"Lagaan", img:"https://upload.wikimedia.org/wikipedia/en/b/b6/Lagaan.jpg" }
];

/* 🎞 TRUE LOOP FIX */
function renderMovies() {
  strip.innerHTML = "";

  const fullList = [...movies, ...movies]; // 🔥 key fix

  fullList.forEach(movie => {
    const div = document.createElement("div");
    div.className = "frame";

    div.innerHTML = `<img src="${movie.img}">`;

    div.onclick = () => selectMovie(movie.name);

    strip.appendChild(div);
  });
}

renderMovies();

/* 🎟 FIXED TICKET */
function selectMovie(name) {
  ticketBox.classList.remove("animate");

  setTimeout(() => {
    ticket.innerHTML = `🎟 ${name}<br>Now Showing ✨`;
    ticketBox.classList.add("animate");
  }, 50);
}
</script>

</body>
</html>
