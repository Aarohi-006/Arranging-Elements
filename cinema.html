<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinema Khoj</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #7b0f0f;
  font-family: 'Playfair Display', serif;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  width: 80%;
  font-size: 32px;
  margin: 20px 0;
  font-family: 'Bebas Neue';
}

/* CLAPPER */
.clapper {
  width: 320px;
  perspective: 600px;
}
.flap {
  height: 40px;
  background: black;
  transform-origin: top;
  transition: 0.4s;
}
.clap { transform: rotateX(-60deg); }

.clapper-body {
  background: #eee;
  padding: 15px;
  border-radius: 10px;
}

.clapper input, .clapper select {
  width: 90%;
  margin: 5px 0;
}

/* 🎞 ROW */
.film-row {
  width: 90%;
  margin: 20px 0;
}

.row-title {
  font-family: 'Bebas Neue';
  font-size: 24px;
  border-bottom: 2px solid gold;
}

/* SCROLL FIX */
.viewport {
  overflow: hidden;
}

.strip {
  display: flex;
  gap: 20px;
  width: max-content;
  animation: scroll 25s linear infinite;
}

.strip:hover {
  animation-play-state: paused;
}

@keyframes scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* CARD */
.frame {
  flex-shrink: 0;
  background: #c9a66b;
  padding: 8px;
  border-radius: 10px;
  cursor: pointer;
}

.frame img {
  width: 140px;
  height: 200px;
  object-fit: cover;
}

.frame small {
  display: block;
  font-size: 10px;
}

.frame:hover { transform: scale(1.1); }

/* TICKET */
.ticket {
  margin: 20px;
  width: 300px;
  height: 160px;
  background: url("ticket.png") no-repeat center;
  background-size: contain;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.3s;
}

.ticket-text {
  color: #3b2a1a;
  text-align: center;
}

.torn {
  transform: rotate(-5deg) scale(0.95);
}

/* GENRES */
.genres button {
  margin: 10px;
  padding: 10px;
  border-radius: 20px;
  border: none;
  background: gold;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
  <div>Cinema</div>
  <div>Khoj</div>
</div>

<!-- CLAPPER -->
<div class="clapper">
  <div class="flap" id="flap"></div>
  <div class="clapper-body">
    <input id="search" placeholder="🎬 Search movie">

    <select id="yearFilter">
      <option value="">All Eras</option>
      <option value="1960s">1960s</option>
      <option value="1970s">1970s</option>
      <option value="1980s">1980s</option>
      <option value="1990s">1990s</option>
      <option value="2000s">2000s</option>
    </select>

    <input placeholder="Actor / Director">
  </div>
</div>

<!-- 🎞 BOLLYWOOD -->
<div class="film-row">
  <div class="row-title">Bollywood</div>
  <div class="viewport">
    <div class="strip" id="bolly"></div>
  </div>
</div>

<!-- 🎞 HOLLYWOOD -->
<div class="film-row">
  <div class="row-title">Hollywood</div>
  <div class="viewport">
    <div class="strip" id="holly"></div>
  </div>
</div>

<!-- 🎟 -->
<div class="ticket" id="ticketBox">
  <div class="ticket-text" id="ticket">🎟 Select a movie</div>
</div>

<!-- GENRE -->
<div class="genres">
  <button>🍿 Action</button>
  <button>🍿 Romance</button>
  <button>🍿 Drama</button>
</div>

<script>

/* DATA */
const movies = [
  {name:"Mother India", genre:"Drama", era:"1950s", industry:"Bollywood", img:"motherindia.jpg"},
  {name:"Sholay", genre:"Action", era:"1970s", industry:"Bollywood", img:"sholay.jpg"},
  {name:"DDLJ", genre:"Romance", era:"1990s", industry:"Bollywood", img:"https://images.unsplash.com/photo-1518929458119-e5bf444c30f4?w=400"},
  {name:"Lagaan", genre:"Drama", era:"2000s", industry:"Bollywood", img:"https://images.unsplash.com/photo-1492724441997-5dc865305da7?w=400"},

  {name:"Godfather", genre:"Drama", era:"1970s", industry:"Hollywood", img:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400"},
  {name:"Titanic", genre:"Romance", era:"1990s", industry:"Hollywood", img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400"},
  {name:"Dark Knight", genre:"Action", era:"2000s", industry:"Hollywood", img:"https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?w=400"},
  {name:"Psycho", genre:"Drama", era:"1960s", industry:"Hollywood", img:"https://images.unsplash.com/photo-1517602302552-471fe67acf66?w=400"}
];

let filteredMovies = [...movies];

const bolly = document.getElementById("bolly");
const holly = document.getElementById("holly");
const ticket = document.getElementById("ticket");
const ticketBox = document.getElementById("ticketBox");
const flap = document.getElementById("flap");
const search = document.getElementById("search");
const yearFilter = document.getElementById("yearFilter");

/* RENDER */
function render(list){
  bolly.innerHTML = "";
  holly.innerHTML = "";

  list.forEach(m=>{
    const div=document.createElement("div");
    div.className="frame";
    div.innerHTML=`<img src="${m.img}"><small>${m.era}</small>`;
    div.onclick=()=>selectMovie(m.name);

    if(m.industry==="Bollywood") bolly.appendChild(div);
    else holly.appendChild(div);
  });

  bolly.innerHTML += bolly.innerHTML;
  holly.innerHTML += holly.innerHTML;
}

render(filteredMovies);

/* SEARCH */
search.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    flap.classList.add("clap");
    setTimeout(()=>flap.classList.remove("clap"),300);

    const val = search.value.toLowerCase();
    filteredMovies = movies.filter(m => m.name.toLowerCase().includes(val));
    render(filteredMovies);
  }
});

/* ERA */
yearFilter.addEventListener("change", ()=>{
  const val = yearFilter.value;
  filteredMovies = val ? movies.filter(m=>m.era===val) : movies;
  render(filteredMovies);
});

/* GENRE */
document.querySelectorAll(".genres button").forEach(btn=>{
  btn.onclick=()=>{
    const g = btn.innerText.replace("🍿","").trim();
    filteredMovies = movies.filter(m=>m.genre===g);
    render(filteredMovies);
  };
});

/* TICKET */
function selectMovie(name){
  ticketBox.classList.add("torn");

  setTimeout(()=>{
    ticket.innerHTML = `🎟 ${name}<br>Now Showing ✨`;
    ticketBox.classList.remove("torn");
  },300);
}

</script>

</body>
</html>
