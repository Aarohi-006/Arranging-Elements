<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retro Music Machine</title>

<style>
body {
  margin: 0;
  background: #6b3e1d;
  font-family: monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.player {
  width: 420px;
  background: #d9c2a3;
  border-radius: 20px;
  padding: 20px;
}

.cassette input {
  width: 100%;
  padding: 8px;
  text-align: center;
}

.vinyl-container {
  position: relative;
  width: 260px;
  height: 260px;
  margin: 20px auto;
}

.vinyl {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle, #000 40%, #111 60%);
}

.spin {
  animation: spin 3s linear infinite;
}
@keyframes spin {
  from { transform: rotate(0); }
  to { transform: rotate(360deg); }
}

/* DOTS */
.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  position: absolute;
  cursor: pointer;
  box-shadow: 0 0 8px white;
}
.dot:hover { transform: scale(1.6); }

/* NEEDLE */
.needle {
  width: 120px;
  height: 4px;
  background: #ccc;
  position: absolute;
  top: 30px;
  right: -20px;
  transform-origin: left;
  transform: rotate(-30deg);
  transition: 0.4s;
}
.needle.drop {
  transform: rotate(10deg);
}

/* CONTROLS */
.controls {
  text-align: center;
}

/* PROGRESS */
progress {
  width: 80%;
  height: 8px;
  margin-top: 10px;
}

/* LIST */
.list-panel {
  background: black;
  color: lime;
  height: 120px;
  overflow-y: auto;
  margin-top: 10px;
  padding: 10px;
}

.list-panel div:hover {
  background: lime;
  color: black;
}

/* NAV */
nav {
  display: flex;
  justify-content: space-around;
  margin-top: 10px;
}
nav span.active {
  background: black;
  color: yellow;
}
</style>
</head>

<body>

<div class="player">

<div class="cassette">
  <input id="search" placeholder="Search song...">
</div>

<div class="vinyl-container">
  <div class="vinyl" id="vinyl">

    <div class="dot" style="top:40%; left:70%; background:red"
         onclick="playTrackCategory('HIPHOP')"></div>

    <div class="dot" style="top:65%; left:30%; background:yellow"
         onclick="playTrackCategory('DISCO')"></div>

    <div class="dot" style="top:30%; left:40%; background:blue"
         onclick="playTrackCategory('POP')"></div>

    <div class="dot" style="top:20%; left:65%; background:purple"
         onclick="playTrackCategory('ROCK')"></div>

    <div class="dot" style="top:75%; left:50%; background:green"
         onclick="playTrackCategory('INDIE')"></div>

  </div>

  <div class="needle" id="needle"></div>
</div>

<div class="controls">
  <div id="nowPlaying">Now Playing: —</div>
  <button onclick="play()">▶</button>
  <button onclick="pause()">⏸</button>

  <!-- ✅ PROGRESS -->
  <progress id="progressBar" value="0" max="100"></progress>
</div>

<section class="list-panel" id="listPanel">
  Select a genre 🎵
</section>

<nav>
  <span class="active">SONGS</span>
  <span>ARTISTS</span>
  <span>ALBUMS</span>
</nav>

</div>

<script>
const vinyl = document.getElementById("vinyl");
const needle = document.getElementById("needle");
const nowPlaying = document.getElementById("nowPlaying");
const listPanel = document.getElementById("listPanel");
const progressBar = document.getElementById("progressBar");

let interval = null;

/* DATA */
const musicData = {
  POP: { album:"Future Nostalgia", artist:"Dua Lipa",
    songs:["Levitating","Don't Start Now","Physical"] },

  ROCK: { album:"Back in Black", artist:"AC/DC",
    songs:["Hells Bells","Shoot to Thrill","Back in Black"] },

  DISCO: { album:"Saturday Night Fever", artist:"Bee Gees",
    songs:["Stayin Alive","Night Fever","More Than a Woman"] },

  INDIE: { album:"AM", artist:"Arctic Monkeys",
    songs:["Do I Wanna Know?","R U Mine?","Why'd You Only Call Me"] },

  HIPHOP: { album:"DAMN.", artist:"Kendrick Lamar",
    songs:["HUMBLE.","DNA.","LOYALTY."] }
};

/* START PROGRESS */
function startProgress() {
  clearInterval(interval);
  progressBar.value = 0;

  interval = setInterval(() => {
    if (progressBar.value < 100) {
      progressBar.value += 1;
    } else {
      clearInterval(interval);
    }
  }, 100);
}

/* PLAY CATEGORY */
function playTrackCategory(category){
  const data = musicData[category];

  nowPlaying.innerText = "Now Playing: " + data.album + " — " + data.artist;

  vinyl.classList.add("spin");

  needle.classList.remove("drop");
  setTimeout(()=>needle.classList.add("drop"),100);

  showAlbum(category);
  startProgress();
}

/* SHOW ALBUM */
function showAlbum(category){
  const data = musicData[category];

  listPanel.innerHTML = `
    <strong>${data.album}</strong><br>
    <em>${data.artist}</em><br><br>
    ${data.songs.map(s=>`<div onclick="playTrack('${s}')">${s}</div>`).join("")}
  `;
}

/* PLAY SONG */
function playTrack(song){
  nowPlaying.innerText = "Now Playing: " + song;
  startProgress();
}

/* PLAY / PAUSE */
function play(){
  vinyl.classList.add("spin");
  needle.classList.add("drop");
  startProgress();
}

function pause(){
  vinyl.classList.remove("spin");
  needle.classList.remove("drop");
  clearInterval(interval);
}

/* NAV */
document.querySelectorAll("nav span").forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll("nav span").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");

    if(tab.innerText==="ARTISTS"){
      listPanel.innerHTML = Object.values(musicData)
        .map(d=>`<div>${d.artist}</div>`).join("");
    }

    if(tab.innerText==="ALBUMS"){
      listPanel.innerHTML = Object.values(musicData)
        .map((d,i)=>`<div onclick="showAlbum('${Object.keys(musicData)[i]}')">${d.album}</div>`).join("");
    }

    if(tab.innerText==="SONGS"){
      listPanel.innerHTML = Object.values(musicData)
        .map(d=>d.songs.map(s=>`<div>${s}</div>`).join("")).join("");
    }
  };
});

/* SEARCH */
document.getElementById("search").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const val=e.target.value.toLowerCase();

    let res=[];
    Object.values(musicData).forEach(d=>{
      d.songs.forEach(s=>{
        if(s.toLowerCase().includes(val)) res.push(s);
      });
    });

    listPanel.innerHTML = res.length
      ? res.map(r=>`<div>${r}</div>`).join("")
      : "No results";
  }
});
</script>

</body>
</html>
