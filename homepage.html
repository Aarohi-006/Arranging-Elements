<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UI Worlds</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: black;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* TITLE */
h1 {
  margin: 30px;
  font-size: 40px;
  letter-spacing: 3px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 250px);
  gap: 30px;
}

/* CARD */
.card {
  width: 250px;
  height: 160px;
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  transition: 0.3s;
}

/* IMAGE */
.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* OVERLAY */
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
}

/* TEXT */
.card span {
  position: absolute;
  bottom: 10px;
  left: 15px;
  font-size: 20px;
  z-index: 2;
}

/* HOVER */
.card:hover {
  transform: scale(1.08);
  box-shadow: 0 0 20px white;
}

/* DIFFERENT THEMES */
.cinema { box-shadow: 0 0 15px red; }
.vending { box-shadow: 0 0 15px cyan; }
.doraemon { box-shadow: 0 0 15px #2D9CDB; }
.music { box-shadow: 0 0 15px gold; }
.genie { box-shadow: 0 0 15px purple; }

</style>
</head>

<body>

<h1>✨ UI WORLDS ✨</h1>

<div class="grid">

  <a href="cinema.html" class="card cinema">
    <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba">
    <span>🎬 Cinema</span>
  </a>

  <a href="vending.html" class="card vending">
    <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c">
    <span>🎮 Vending Arcade</span>
  </a>

  <a href="doraemon.html" class="card doraemon">
    <img src="https://wallpaperaccess.com/full/1848171.jpg">
    <span>🚪 Doraemon Door</span>
  </a>

  <a href="music.html" class="card music">
    <img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d">
    <span>🎵 Music Machine</span>
  </a>

  <a href="genie.html" class="card genie">
    <img src="https://images.unsplash.com/photo-1604079628040-94301bb21b91">
    <span>🧞 Genie Bazaar</span>
  </a>

</div>

</body>
</html>
