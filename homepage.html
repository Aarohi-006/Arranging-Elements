<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UI Directions Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  font-family: 'Inter', sans-serif;
  color: white;

  /* 🌌 ABSTRACT BACKGROUND */
  background: radial-gradient(circle at 20% 20%, #3a0ca3, transparent),
              radial-gradient(circle at 80% 80%, #ff006e, transparent),
              #0f0f1a;
}

/* TITLE */
h1 {
  font-family: 'Bebas Neue';
  letter-spacing: 4px;
  font-size: 48px;
  margin-bottom: 40px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 180px);
  gap: 25px;
}

/* CARD */
.card {
  height: 120px;
  border-radius: 20px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  font-size: 18px;
  text-align: center;

  cursor: pointer;
  transition: 0.3s;

  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
}

/* HOVER */
.card:hover {
  transform: translateY(-10px) scale(1.05);
  box-shadow: 0 0 20px rgba(255,255,255,0.3);
}

/* EMOJI */
.card span {
  font-size: 28px;
  margin-bottom: 8px;
}

/* INDIVIDUAL COLORS */
.doraemon:hover { background: rgba(0,150,255,0.3); }
.cinema:hover { background: rgba(255,100,0,0.3); }
.music:hover { background: rgba(255,0,200,0.3); }
.genie:hover { background: rgba(150,0,255,0.3); }
.vending:hover { background: rgba(0,255,150,0.3); }

/* FOOTER NOTE */
.note {
  margin-top: 30px;
  font-size: 12px;
  opacity: 0.6;
}
</style>
</head>

<body>

<h1>✨ UI DIRECTIONS ✨</h1>

<div class="grid">

  <div class="card doraemon" onclick="go('doraemon.html')">
    <span>🚪</span>
    Doraemon Door
  </div>

  <div class="card cinema" onclick="go('cinema.html')">
    <span>🎬</span>
    Cinema Khoj
  </div>

  <div class="card music" onclick="go('music.html')">
    <span>🎵</span>
    Music Machine
  </div>

  <div class="card genie" onclick="go('genie.html')">
    <span>🧞</span>
    Genie Bazaar
  </div>

  <div class="card vending" onclick="go('vending.html')">
    <span>🕹</span>
    Arcade Vending
  </div>

</div>

<div class="note">Select a direction to explore</div>

<script>
function go(page) {
  window.location.href = page;
}
</script>

</body>
</html>
