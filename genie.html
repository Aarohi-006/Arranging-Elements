<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genie Bazaar Premium UI</title>

<style>
body {
  margin: 0;
  font-family: serif;
  overflow: hidden;
  color: white;

  background: radial-gradient(circle at top, #9d4edd, #3c096c 60%, #240046);
  cursor: url('genie-cursor.png') 16 16, auto;
}

/* ⭐ FIX: overlay should NOT block clicks */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.15;
  pointer-events: none; /* 🔥 IMPORTANT FIX */
}

/* 🧞 CARPET */
.container {
  width: 750px;
  margin: 80px auto;
  padding: 30px;

  background: radial-gradient(#8b1e3f, #3a0c1d);
  border: 6px solid gold;
  border-radius: 60px 60px 40px 40px;

  box-shadow: 0 0 40px rgba(0,0,0,0.6),
              inset 0 0 30px rgba(0,0,0,0.5);

  position: relative;
  z-index: 1; /* ensure above background */

  animation: floatCarpet 4s ease-in-out infinite;
}

@keyframes floatCarpet {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* TITLE */
.titlebar {
  text-align: center;
  font-size: 22px;
  margin-bottom: 15px;
}

/* SEARCH */
.search-cloud {
  background: radial-gradient(circle, #c77dff, #7b2cbf);
  padding: 15px;
  border-radius: 40px;
  border: 2px solid gold;
  text-align: center;
  margin-bottom: 20px;
}

/* STALLS */
.carpet-items {
  display: flex;
  justify-content: space-around;
}

.stall {
  width: 120px;
  height: 140px;
  text-align: center;
  cursor: pointer;

  background: linear-gradient(#9d4edd, #5a189a);
  border: 2px solid gold;
  border-radius: 20px;

  display: flex;
  flex-direction: column;
  justify-content: center;

  transition: 0.3s;
}

/* hover now works */
.stall:hover {
  transform: translateY(-10px) scale(1.1);
}

/* active */
.stall.active {
  box-shadow: 0 0 20px gold;
  transform: scale(1.1);
}

/* SCROLL */
.scroll {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%) scaleY(0);

  width: 320px;
  padding: 20px;

  background: #f5deb3;
  color: #3b2a1a;

  border-radius: 10px;
  transform-origin: top;
  transition: 0.5s;
}

.scroll.show {
  transform: translateX(-50%) scaleY(1);
}

/* GENIE */
.genie {
  position: absolute;
  top: -120px;
  left: 50%;
  transform: translateX(-50%) scale(0);
  width: 80px;
  transition: 0.5s;
}

.genie.show {
  transform: translateX(-50%) scale(1);
}

/* BUTTON */
.wish-btn {
  display: block;
  margin: 20px auto;
  padding: 10px 20px;

  background: gold;
  border: none;
  border-radius: 20px;
  cursor: pointer;
}

/* NAV */
nav {
  text-align: center;
}

nav span {
  margin: 0 10px;
  padding: 8px 14px;
  border: 1px solid gold;
  border-radius: 20px;
  cursor: pointer;
}

/* SMOKE */
.smoke {
  position: absolute;
  width: 12px;
  height: 12px;
  background: radial-gradient(circle, rgba(180,150,255,0.9), transparent);
  border-radius: 50%;
  pointer-events: none;
  animation: smoke 0.8s forwards;
}

@keyframes smoke {
  to {
    transform: scale(2.5);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="titlebar">🧞 GENIE BAZAAR</div>

<div class="search-cloud">
  <input placeholder="✨ What do you seek?">
</div>

<img src="genie.png" class="genie" id="genie">
<div class="scroll" id="scroll"></div>

<section class="carpet-items">
  <div class="stall">🏺<br>SPICES</div>
  <div class="stall">💎<br>JEWELS</div>
  <div class="stall">🧵<br>FABRICS</div>
</section>

<button class="wish-btn" id="wishBtn">✨ Grant Wish</button>

<nav>
  <span>Africa</span>
  <span>Middle East</span>
  <span>Asia</span>
  <span>Europe</span>
</nav>

</div>

<script>
const stalls = document.querySelectorAll(".stall");
const scroll = document.getElementById("scroll");
const genie = document.getElementById("genie");
const btn = document.getElementById("wishBtn");

let selected = "";

/* CLICK FIX */
stalls.forEach(stall => {
  stall.addEventListener("click", () => {

    stalls.forEach(s => s.classList.remove("active"));

    stall.classList.add("active");

    selected = stall.innerText;
  });
});

/* BUTTON FIX */
btn.addEventListener("click", () => {

  scroll.classList.remove("show");
  genie.classList.remove("show");

  setTimeout(() => {

    if (!selected) {
      scroll.innerHTML = "🧞 Choose an item first!";
    } else {
      scroll.innerHTML = "🧞 " + selected + "<br>✨ Your wish is granted!";
    }

    scroll.classList.add("show");
    genie.classList.add("show");

  }, 200);
});

/* SMOKE */
let last = 0;

document.addEventListener("mousemove", e => {
  const now = Date.now();
  if (now - last > 50) {

    const s = document.createElement("div");
    s.className = "smoke";
    s.style.left = e.pageX + "px";
    s.style.top = e.pageY + "px";

    document.body.appendChild(s);
    setTimeout(() => s.remove(), 800);

    last = now;
  }
});
</script>

</body>
</html>
