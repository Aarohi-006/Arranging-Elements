<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genie Bazaar UI</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Cinzel', serif;
  background: #2b0a3d;
  color: white;
  overflow: hidden;

  cursor: none; /* ✅ hide default cursor */
}

/* CONTAINER */
.container {
  width: 900px;
  margin: 40px auto;
  position: relative;
  text-align: center;
}

/* IMAGE */
.ui-image {
  width: 100%;
  display: block;
  border-radius: 20px;
}

/* HOTSPOTS */
.hotspot, .lamp, nav span {
  cursor: none;
}

.hotspot {
  position: absolute;
  border-radius: 20px;
  background: rgba(255,215,0,0.08);
  transition: 0.3s;
}

.spices { top: 140px; left: 110px; width: 200px; height: 230px; }
.jewels { top: 140px; left: 350px; width: 200px; height: 230px; }
.fabrics { top: 140px; left: 600px; width: 200px; height: 230px; }

.hotspot:hover {
  background: rgba(255,215,0,0.15);
  box-shadow: 0 0 25px gold;
}

.hotspot.active {
  background: rgba(255,215,0,0.2);
  box-shadow: 0 0 40px gold;
}

/* 🪔 LAMP */
.lamp {
  font-size: 48px;
  margin-top: 20px;
  transition: 0.3s;
}

.lamp:hover {
  transform: scale(1.2);
}

.lamp.rub {
  animation: rub 0.5s;
}

@keyframes rub {
  0% { transform: rotate(0); }
  50% { transform: rotate(-15deg); }
  100% { transform: rotate(0); }
}

/* 🧞 GENIE */
.genie {
  position: absolute;
  top: -60px;
  left: 50%;
  transform: translateX(-50%) scale(0);
  width: 100px;
  transition: 0.4s;
  filter: drop-shadow(0 0 20px #c77dff);
  z-index: 3;
}

.genie.show {
  transform: translateX(-50%) scale(1);
}

/* 📜 SCROLL */
.scroll {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%) scaleY(0);

  width: 320px;
  padding: 20px;

  background: #f5deb3;
  color: #3b2a1a;

  border-radius: 10px;
  transform-origin: top;
  transition: 0.4s;
  z-index: 2;
  text-align: center;
}

.scroll.show {
  transform: translateX(-50%) scaleY(1);
}

/* NAV */
nav {
  margin-top: 15px;
}

nav span {
  margin: 0 10px;
  padding: 8px 14px;
  border: 1px solid gold;
  border-radius: 20px;
}

nav span.active {
  background: gold;
  color: black;
}

/* 🧞 FLOATING GENIE CURSOR */
#genieCursor {
  position: fixed;
  top: 0;
  left: 0;
  width: 40px;
  pointer-events: none;
  z-index: 9999;

  transform: translate(-50%, -50%);
  
  filter: drop-shadow(0 0 10px #c77dff)
          drop-shadow(0 0 20px #9d4edd);

  transition: transform 0.08s linear;
}

/* ✨ TRAIL */
.trail {
  position: fixed;
  width: 8px;
  height: 8px;
  background: radial-gradient(circle, #c77dff, transparent);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  animation: fadeOut 0.6s forwards;
}

@keyframes fadeOut {
  to {
    opacity: 0;
    transform: scale(2);
  }
}
</style>
</head>

<body>

<div class="container">

<img src="genie.png" class="genie" id="genie">

<div class="scroll" id="scroll"></div>

<!-- BAZAAR IMAGE -->
<img src="bazaar.png" class="ui-image">

<!-- HOTSPOTS -->
<div class="hotspot spices" data-item="SPICES"></div>
<div class="hotspot jewels" data-item="JEWELS"></div>
<div class="hotspot fabrics" data-item="FABRICS"></div>

<!-- 🪔 LAMP (TRIGGER) -->
<div class="lamp" id="lamp">🪔</div>

<!-- NAV -->
<nav>
  <span class="active" data-region="Asia">Asia</span>
  <span data-region="Africa">Africa</span>
  <span data-region="Europe">Europe</span>
  <span data-region="Middle East">Middle East</span>
</nav>

<!-- 🧞 CURSOR -->
<img src="genie-cursor.png" id="genieCursor">

</div>

<script>
const hotspots = document.querySelectorAll(".hotspot");
const scroll = document.getElementById("scroll");
const genie = document.getElementById("genie");
const lamp = document.getElementById("lamp");
const navItems = document.querySelectorAll("nav span");

let selected = "";
let currentRegion = "Asia";

/* DATA */
const data = {
  Asia: {
    SPICES: { items: "Saffron, Cardamom, Turmeric", bazaar: "Grand Bazaar Istanbul" },
    JEWELS: { items: "Jade, Ruby, Pearl", bazaar: "Jaipur Gem Market" },
    FABRICS: { items: "Silk, Banarasi", bazaar: "Varanasi Textile Bazaar" }
  },
  Africa: {
    SPICES: { items: "Berbere, Cloves", bazaar: "Marrakech Souk" },
    JEWELS: { items: "Gold, Amber", bazaar: "Cairo Bazaar" },
    FABRICS: { items: "Kente, Mudcloth", bazaar: "Accra Market" }
  },
  Europe: {
    SPICES: { items: "Rosemary, Thyme", bazaar: "Barcelona Market" },
    JEWELS: { items: "Emerald, Sapphire", bazaar: "Antwerp District" },
    FABRICS: { items: "Velvet, Linen", bazaar: "Florence Market" }
  },
  "Middle East": {
    SPICES: { items: "Za’atar, Sumac", bazaar: "Dubai Spice Souk" },
    JEWELS: { items: "Opal, Topaz", bazaar: "Gold Souk Dubai" },
    FABRICS: { items: "Brocade, Silk", bazaar: "Tehran Bazaar" }
  }
};

/* SELECT STALL */
hotspots.forEach(h => {
  h.addEventListener("click", () => {
    hotspots.forEach(x => x.classList.remove("active"));
    h.classList.add("active");
    selected = h.dataset.item;
  });
});

/* NAV */
navItems.forEach(nav => {
  nav.addEventListener("click", () => {
    navItems.forEach(n => n.classList.remove("active"));
    nav.classList.add("active");
    currentRegion = nav.dataset.region;
  });
});

/* 🪔 LAMP FLOW */
lamp.addEventListener("click", () => {

  lamp.classList.add("rub");

  scroll.classList.remove("show");
  genie.classList.remove("show");

  setTimeout(() => {

    genie.classList.add("show");

    scroll.innerHTML = "✨ Summoning treasures...";
    scroll.classList.add("show");

    setTimeout(() => {

      if (!selected) {
        scroll.innerHTML = "🧞 Select a stall first!";
      } else {
        const result = data[currentRegion][selected];

        scroll.innerHTML = `
          🧞 ${selected} from ${currentRegion}<br><br>
          📍 ${result.bazaar}<br>
          ✨ ${result.items}
        `;
      }

    }, 600);

  }, 200);

});

/* 🧞 CURSOR FOLLOW + TRAIL */
const genieCursor = document.getElementById("genieCursor");

document.addEventListener("mousemove", (e) => {
  genieCursor.style.left = e.clientX + "px";
  genieCursor.style.top = e.clientY + "px";

  const trail = document.createElement("div");
  trail.className = "trail";
  trail.style.left = e.clientX + "px";
  trail.style.top = e.clientY + "px";

  document.body.appendChild(trail);

  setTimeout(() => {
    trail.remove();
  }, 600);
});
</script>

</body>
</html>
