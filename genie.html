<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genie Bazaar Premium UI</title>

<style>
body {
  margin: 0;
  font-family: serif;
  overflow: hidden;
  color: white;

  /* 🌌 ALADDIN SKY */
  background: radial-gradient(circle at top, #9d4edd, #3c096c 60%, #240046);

  cursor: url('genie-cursor.png') 16 16, auto;
}

/* ✨ STARS */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.15;
}

/* 🧞 MAIN PANEL (LIKE WEBAMP WINDOW) */
.container {
  width: 720px;
  margin: 60px auto;
  padding: 25px;

  background: linear-gradient(#5a189a, #3c096c);
  border: 6px solid gold;
  border-radius: 25px;

  box-shadow: 0 0 40px rgba(255,215,0,0.4);
  position: relative;
}

/* TITLE BAR */
.titlebar {
  text-align: center;
  font-size: 22px;
  margin-bottom: 15px;
  letter-spacing: 2px;
}

/* ☁️ SEARCH (MAGIC SMOKE) */
.search-cloud {
  background: radial-gradient(circle, #c77dff, #7b2cbf);
  padding: 15px;
  border-radius: 40px;
  border: 2px solid gold;
  text-align: center;
  margin-bottom: 20px;
  box-shadow: 0 0 20px rgba(255,255,255,0.3);
}

.search-cloud input {
  border: none;
  padding: 10px;
  border-radius: 20px;
  width: 60%;
  text-align: center;
  outline: none;
}

/* 🧞 CARPET */
.carpet {
  background: radial-gradient(#8b1e3f, #3a0c1d);
  border: 4px solid gold;
  border-radius: 20px;
  padding: 20px;

  display: flex;
  justify-content: space-around;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
}

/* 🏺 STALL CARDS */
.stall {
  width: 120px;
  height: 140px;
  text-align: center;
  cursor: pointer;

  background: linear-gradient(#9d4edd, #5a189a);
  border: 2px solid gold;
  border-radius: 20px 20px 10px 10px;

  display: flex;
  flex-direction: column;
  justify-content: center;

  transition: 0.3s;
}

.stall:hover {
  transform: translateY(-10px) scale(1.1);
  box-shadow: 0 0 15px gold;
}

/* 📜 SCROLL */
.scroll {
  position: absolute;
  top: 90px;
  left: 50%;
  transform: translateX(-50%) scaleY(0);

  width: 300px;
  padding: 20px;
  text-align: center;

  background: #f5deb3;
  color: #3b2a1a;

  border: 2px solid #8b6f47;
  border-radius: 10px;

  transform-origin: top;
  transition: 0.5s;
}

.scroll.show {
  transform: translateX(-50%) scaleY(1);
}

/* ✨ SMOKE TRAIL */
.smoke {
  position: absolute;
  width: 12px;
  height: 12px;
  background: radial-gradient(circle, rgba(180,150,255,0.9), transparent);
  border-radius: 50%;
  pointer-events: none;
  animation: smoke 0.8s forwards;
}

@keyframes smoke {
  to {
    transform: scale(2.5);
    opacity: 0;
  }
}

/* 🌍 NAV */
nav {
  margin-top: 20px;
  text-align: center;
}

nav span {
  margin: 0 10px;
  padding: 8px 14px;
  border: 1px solid gold;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.2s;
}

nav span:hover {
  background: gold;
  color: black;
}

/* ✨ WISH BUTTON */
.wish-btn {
  display: block;
  margin: 20px auto 0;
  padding: 10px 20px;

  background: gold;
  border: none;
  border-radius: 20px;
  cursor: pointer;

  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<div class="titlebar">🧞 GENIE GLOBAL BAZAAR</div>

<!-- SEARCH -->
<div class="search-cloud">
  <input placeholder="✨ What do you seek?">
</div>

<!-- SCROLL -->
<div class="scroll" id="scroll"></div>

<!-- CARPET -->
<section class="carpet">
  <div class="stall" onclick="selectItem('Spices 🏺')">🏺<br>SPICES</div>
  <div class="stall" onclick="selectItem('Jewels 💎')">💎<br>JEWELS</div>
  <div class="stall" onclick="selectItem('Fabrics 🧵')">🧵<br>FABRICS</div>
</section>

<button class="wish-btn" onclick="grantWish()">✨ Grant Wish</button>

<!-- NAV -->
<nav>
  <span>Africa</span>
  <span>Middle East</span>
  <span>Asia</span>
  <span>Europe</span>
</nav>

</div>

<script>
const scroll = document.getElementById("scroll");
let selected = "";

/* SELECT */
function selectItem(item) {
  selected = item;
}

/* GRANT WISH */
function grantWish() {
  if (!selected) return;

  scroll.innerHTML = "🧞 " + selected + "<br>✨ A treasure worthy of a sultan!";
  scroll.classList.add("show");
}

/* SMOKE CURSOR */
let last = 0;

document.addEventListener("mousemove", e => {
  const now = Date.now();
  if (now - last > 50) {

    const s = document.createElement("div");
    s.className = "smoke";
    s.style.left = e.pageX + "px";
    s.style.top = e.pageY + "px";

    document.body.appendChild(s);
    setTimeout(() => s.remove(), 800);

    last = now;
  }
});
</script>

</body>
</html>
