<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genie Bazaar Premium UI</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Cinzel', serif;
  background: #2b0a3d;
  color: white;
  overflow: hidden;
}

/* MAIN UI */
.container {
  width: 900px;
  margin: 40px auto;
  position: relative;
  text-align: center;
}

/* YOUR IMAGE */
.ui-image {
  width: 100%;
  border-radius: 20px;
  display: block;
}

/* HOTSPOTS */
.hotspot {
  position: absolute;
  cursor: pointer;
  border-radius: 20px;
  transition: 0.2s;
}

/* POSITIONED OVER YOUR DESIGN */
.spices { top: 140px; left: 110px; width: 200px; height: 230px; }
.jewels { top: 140px; left: 350px; width: 200px; height: 230px; }
.fabrics { top: 140px; left: 600px; width: 200px; height: 230px; }

/* HOVER */
.hotspot:hover {
  outline: 3px solid gold;
  box-shadow: 0 0 20px gold;
}

/* ACTIVE */
.hotspot.active {
  outline: 4px solid gold;
  box-shadow: 0 0 30px gold;
}

/* SCROLL */
.scroll {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%) scaleY(0);

  width: 320px;
  padding: 20px;

  background: #f5deb3;
  color: #3b2a1a;

  border-radius: 10px;
  transform-origin: top;
  transition: 0.4s;
  z-index: 2;
}

.scroll.show {
  transform: translateX(-50%) scaleY(1);
}

/* GENIE */
.genie {
  position: absolute;
  top: -80px;
  left: 50%;
  transform: translateX(-50%) scale(0);
  width: 90px;
  transition: 0.4s;
  z-index: 3;
}

.genie.show {
  transform: translateX(-50%) scale(1);
}

/* BUTTON */
.wish-btn {
  margin-top: 20px;
  padding: 10px 20px;
  background: gold;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-family: 'Cinzel';
}

/* NAV */
nav {
  margin-top: 20px;
}

nav span {
  margin: 0 10px;
  padding: 8px 14px;
  border: 1px solid gold;
  border-radius: 20px;
  cursor: pointer;
}

nav span.active {
  background: gold;
  color: black;
  box-shadow: 0 0 10px gold;
}
</style>
</head>

<body>

<div class="container">

<img src="genie.png" class="genie" id="genie">

<div class="scroll" id="scroll"></div>

<!-- YOUR UI IMAGE -->
<img src="bazaar.png" class="ui-image">

<!-- HOTSPOTS -->
<div class="hotspot spices" data-item="SPICES"></div>
<div class="hotspot jewels" data-item="JEWELS"></div>
<div class="hotspot fabrics" data-item="FABRICS"></div>

<button class="wish-btn" id="wishBtn">✨ Grant Wish</button>

<nav>
  <span class="active" data-region="Asia">Asia</span>
  <span data-region="Africa">Africa</span>
  <span data-region="Europe">Europe</span>
  <span data-region="Middle East">Middle East</span>
</nav>

</div>

<script>
const hotspots = document.querySelectorAll(".hotspot");
const scroll = document.getElementById("scroll");
const genie = document.getElementById("genie");
const btn = document.getElementById("wishBtn");
const navItems = document.querySelectorAll("nav span");

let selected = "";
let currentRegion = "Asia";

/* DATA */
const data = {
  Asia: {
    SPICES: { items: "Saffron, Cardamom, Turmeric", bazaar: "Grand Bazaar Istanbul" },
    JEWELS: { items: "Jade, Ruby, Pearl", bazaar: "Jaipur Gem Market" },
    FABRICS: { items: "Silk, Banarasi", bazaar: "Varanasi Textile Bazaar" }
  },
  Africa: {
    SPICES: { items: "Berbere, Cloves", bazaar: "Marrakech Souk" },
    JEWELS: { items: "Gold, Amber", bazaar: "Cairo Bazaar" },
    FABRICS: { items: "Kente, Mudcloth", bazaar: "Accra Market" }
  },
  Europe: {
    SPICES: { items: "Rosemary, Thyme", bazaar: "Barcelona Market" },
    JEWELS: { items: "Emerald, Sapphire", bazaar: "Antwerp District" },
    FABRICS: { items: "Velvet, Linen", bazaar: "Florence Market" }
  },
  "Middle East": {
    SPICES: { items: "Za’atar, Sumac", bazaar: "Dubai Spice Souk" },
    JEWELS: { items: "Opal, Topaz", bazaar: "Gold Souk Dubai" },
    FABRICS: { items: "Brocade, Silk", bazaar: "Tehran Bazaar" }
  }
};

/* SELECT STALL */
hotspots.forEach(h => {
  h.addEventListener("click", () => {
    hotspots.forEach(x => x.classList.remove("active"));
    h.classList.add("active");
    selected = h.dataset.item;
  });
});

/* NAV */
navItems.forEach(nav => {
  nav.addEventListener("click", () => {
    navItems.forEach(n => n.classList.remove("active"));
    nav.classList.add("active");
    currentRegion = nav.dataset.region;
  });
});

/* BUTTON */
btn.addEventListener("click", () => {

  if (!selected) {
    scroll.innerHTML = "🧞 Select a stall first!";
  } else {
    const result = data[currentRegion][selected];

    scroll.innerHTML = `
      🧞 ${selected} from ${currentRegion}<br><br>
      📍 ${result.bazaar}<br>
      ✨ ${result.items}
    `;
  }

  scroll.classList.add("show");
  genie.classList.add("show");
});
</script>

</body>
</html>
