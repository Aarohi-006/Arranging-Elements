<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genie Bazaar UI</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Cinzel', serif;
  color: white;
  overflow: hidden;

  background: radial-gradient(circle at top, #9d4edd, #3c096c 60%, #240046);
}

/* ✨ STARS */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.2;
  pointer-events: none;
}

/* MAIN */
.container {
  width: 900px;
  margin: 40px auto;
  text-align: center;
  position: relative;
}

/* 🪔 LAMP */
.lamp {
  font-size: 50px;
  cursor: pointer;
  margin-bottom: 20px;
  transition: 0.3s;
}

.lamp:hover {
  transform: scale(1.2);
}

.lamp.rub {
  animation: rub 0.5s;
}

@keyframes rub {
  0% { transform: rotate(0); }
  50% { transform: rotate(-15deg); }
  100% { transform: rotate(0); }
}

/* 🧞 GENIE */
.genie {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%) scale(0);
  width: 100px;
  transition: 0.4s;
  filter: drop-shadow(0 0 20px #c77dff);
}

.genie.show {
  transform: translateX(-50%) scale(1);
}

/* 📜 SCROLL */
.scroll {
  margin-top: 20px;
  background: #f5deb3;
  color: #3b2a1a;
  padding: 20px;
  border-radius: 12px;
  width: 300px;
  margin-left: auto;
  margin-right: auto;
  transform: scaleY(0);
  transform-origin: top;
  transition: 0.4s;
}

.scroll.show {
  transform: scaleY(1);
}

/* 🏺 STALLS */
.stalls {
  display: flex;
  justify-content: space-around;
  margin-top: 40px;
}

.stall {
  width: 150px;
  padding: 20px;
  border-radius: 20px;
  border: 1px solid gold;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  cursor: pointer;
  transition: 0.3s;
}

.stall:hover {
  transform: translateY(-10px) scale(1.05);
  box-shadow: 0 0 20px gold;
}

.stall.active {
  box-shadow: 0 0 30px gold;
}

/* BUTTON */
.wish-btn {
  margin-top: 20px;
  padding: 10px 20px;
  background: gold;
  border: none;
  border-radius: 20px;
  cursor: pointer;
}

/* NAV */
nav {
  margin-top: 20px;
}

nav span {
  margin: 0 10px;
  padding: 8px 14px;
  border: 1px solid gold;
  border-radius: 20px;
  cursor: pointer;
}

nav span.active {
  background: gold;
  color: black;
}

/* ✨ SPARK TRAIL */
.spark {
  position: absolute;
  width: 6px;
  height: 6px;
  background: gold;
  border-radius: 50%;
  pointer-events: none;
  animation: fade 0.6s forwards;
}

@keyframes fade {
  to {
    transform: scale(2);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- 🪔 LAMP -->
<div class="lamp" id="lamp">🪔</div>

<!-- 🧞 GENIE -->
<img src="genie.png" class="genie" id="genie">

<!-- 📜 SCROLL -->
<div class="scroll" id="scroll"></div>

<!-- 🏺 STALLS -->
<div class="stalls">
  <div class="stall" data-item="SPICES">🏺 SPICES</div>
  <div class="stall" data-item="JEWELS">💎 JEWELS</div>
  <div class="stall" data-item="FABRICS">🧵 FABRICS</div>
</div>

<button class="wish-btn" id="wishBtn">✨ Grant Wish</button>

<!-- 🌍 NAV -->
<nav>
  <span class="active" data-region="Asia">Asia</span>
  <span data-region="Africa">Africa</span>
  <span data-region="Europe">Europe</span>
  <span data-region="Middle East">Middle East</span>
</nav>

</div>

<script>
const lamp = document.getElementById("lamp");
const genie = document.getElementById("genie");
const scroll = document.getElementById("scroll");
const stalls = document.querySelectorAll(".stall");
const navItems = document.querySelectorAll("nav span");

let selected = "";
let currentRegion = "Asia";

/* DATA */
const data = {
  Asia: {
    SPICES: "Saffron, Cardamom, Turmeric",
    JEWELS: "Jade, Ruby, Pearl",
    FABRICS: "Silk, Banarasi"
  },
  Africa: {
    SPICES: "Berbere, Cloves",
    JEWELS: "Gold, Amber",
    FABRICS: "Kente, Mudcloth"
  },
  Europe: {
    SPICES: "Rosemary, Thyme",
    JEWELS: "Emerald, Sapphire",
    FABRICS: "Velvet, Linen"
  },
  "Middle East": {
    SPICES: "Za’atar, Sumac",
    JEWELS: "Opal, Topaz",
    FABRICS: "Brocade, Silk"
  }
};

/* STALL SELECT */
stalls.forEach(s => {
  s.onclick = () => {
    stalls.forEach(x => x.classList.remove("active"));
    s.classList.add("active");
    selected = s.dataset.item;
  };
});

/* NAV */
navItems.forEach(n => {
  n.onclick = () => {
    navItems.forEach(x => x.classList.remove("active"));
    n.classList.add("active");
    currentRegion = n.dataset.region;
  };
});

/* 🪔 LAMP INTERACTION */
lamp.onclick = () => {
  lamp.classList.add("rub");

  setTimeout(() => {
    genie.classList.add("show");
  }, 200);
};

/* ✨ WISH */
document.getElementById("wishBtn").onclick = () => {

  scroll.classList.remove("show");

  setTimeout(() => {

    if (!selected) {
      scroll.innerHTML = "🧞 Select a stall first!";
    } else {
      scroll.innerHTML = `
        🧞 ${selected} from ${currentRegion}<br><br>
        ✨ ${data[currentRegion][selected]}
      `;
    }

    scroll.classList.add("show");

  }, 300);
};

/* ✨ MAGIC TRAIL */
document.addEventListener("mousemove", e => {
  const spark = document.createElement("div");
  spark.className = "spark";
  spark.style.left = e.pageX + "px";
  spark.style.top = e.pageY + "px";
  document.body.appendChild(spark);

  setTimeout(() => spark.remove(), 600);
});
</script>

</body>
</html>
