<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UI Worlds</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  font-family: 'Inter', sans-serif;
  color: white;

  background: #0f0f1a;
}

/* TITLE */
h1 {
  font-family: 'Bebas Neue';
  font-size: 50px;
  letter-spacing: 4px;
  margin-bottom: 50px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 200px);
  gap: 25px;
}

/* CARD */
.card {
  height: 120px;
  border-radius: 20px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  font-size: 18px;
  cursor: pointer;

  background: #1c1c2e;
  border: 2px solid transparent;

  transition: 0.3s;
}

/* HOVER GLOW */
.card:hover {
  transform: translateY(-8px);
}

/* INDIVIDUAL COLORS */
.cinema:hover {
  border-color: #ff4d4d;
  box-shadow: 0 0 15px #ff4d4d;
}

.vending:hover {
  border-color: #00ffd5;
  box-shadow: 0 0 15px #00ffd5;
}

.doraemon:hover {
  border-color: #4da6ff;
  box-shadow: 0 0 15px #4da6ff;
}

.music:hover {
  border-color: #ffd54d;
  box-shadow: 0 0 15px #ffd54d;
}

.genie:hover {
  border-color: #c77dff;
  box-shadow: 0 0 15px #c77dff;
}

/* EMOJI */
.card span {
  font-size: 28px;
  margin-bottom: 8px;
}
</style>
</head>

<body>

<h1>✨ UI WORLDS ✨</h1>

<div class="grid">

  <div class="card cinema" onclick="go('cinema.html')">
    <span>🎬</span>
    Cinema
  </div>

  <div class="card vending" onclick="go('vending.html')">
    <span>🕹</span>
    Vending Arcade
  </div>

  <div class="card doraemon" onclick="go('doraemon.html')">
    <span>🚪</span>
    Doraemon Door
  </div>

  <div class="card music" onclick="go('music.html')">
    <span>🎵</span>
    Music Machine
  </div>

  <div class="card genie" onclick="go('genie.html')">
    <span>🧞</span>
    Genie Bazaar
  </div>

</div>

<script>
function go(page) {
  window.location.href = page;
}
</script>

</body>
</html>
